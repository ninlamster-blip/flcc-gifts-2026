const QS=["I like to organize people, tasks, and events.","I would like to start churches in places where they do not presently exist.","I enjoy working creatively with wood, cloth, paints, metal, glass, or other materials.","I enjoy challenging people's perspective of God by using various forms of art.","I can readily distinguish between spiritual truth and error, good and evil.","I tend to see the potential in people.","I communicate the gospel to others with clarity and effectiveness.","I find it natural and easy to trust God to answer my prayers.","I give liberally and joyfully to people in financial need or to projects requiring support.","I enjoy working behind the scenes to support the work of others.","I view my home as a place to minister to people in need.","I take prayer requests from others and consistently pray for them.","I am approached by people who want to know my perspective on a particular passage or biblical truth.","I am able to motivate others to accomplish a goal.","I empathize with hurting people and desire to help in their healing process.","I can speak in a way that results in conviction and change in the lives of others.","I enjoy spending time nurturing and caring for others.","I am able to communicate God's word effectively.","I am often sought out by others for advice about spiritual or personal matters.","I am careful, thorough, and skilled at managing details.","I am attracted to the idea of serving in another country or ethnic community.","I am skilled in working with different kinds of tools.","I enjoy developing and using my artistic skills (art, drama, music, photography, etc.).","I frequently am able to judge a person's character based upon first impressions.","I enjoy reassuring and strengthening those who are discouraged.","I consistently look for opportunities to build relationships with non-Christians.","I have confidence in God's continuing provision and help, even in difficult times.","I give more than a tithe so that kingdom work can be accomplished.","I enjoy doing routine tasks that support the ministry.","I enjoy meeting new people and helping them to feel welcomed.","I enjoy praying for long periods of time and receive leading as to what God wants me to pray for.","I receive information from the Spirit that I did not acquire through natural means.","I am able to influence others to achieve a vision.","I can patiently support those going through painful experiences as they try to stabilize their lives.","I feel responsible to confront others with the truth.","I have compassion for wandering believers and want to protect them.","I can spend time in study knowing that presenting truth will make a difference in lives of people.","I can often find simple, practical solutions in the midst of conflict or confusion.","I can clarify goals and develop strategies or plans to accomplish them.","I am willing to take an active part in starting a new church.","I enjoy making things for use in ministry.","I help people understand themselves, their relationship, and God better through artistic expression.","I can see through phoniness or deceit before it is evident to others.","I give hope to others by directing them to the promises of God.","I am effective at adapting the gospel message so that it connects with an individual's felt need.","I believe that God will help me to accomplish great things.","I manage my money well in order to free more of it for giving.","I willingly take on a variety of odd jobs around the church to meet the needs of others.","I genuinely believe the Lord directs strangers to me who need to get connected to others.","I am conscious of ministering to others as I pray.","I am committed, and schedule blocks of time for reading and studying the Scriptures, to understand biblical truth fully and accurately.","I can adjust my leadership style to bring out the best in others.","I enjoy helping people sometimes regarded as undeserving or beyond help.","I boldly expose cultural trends, teachings, or events which contradict biblical principles.","I like to provide guidance for the whole person — relationally, emotionally, spiritually, etc.","I pay close attention to the words, phrases, and meaning of those who teach.","I can easily select the most effective course of action from among several alternatives.","I can identify and effectively use the resources needed to accomplish tasks.","I can adapt well to different cultures and surroundings.","I can visualize how something should be constructed before I build it.","I like finding new and fresh ways of communicating God's truth.","I tend to see rightness or wrongness in situations.","I reassure those who need to take courageous action in their faith, family, or life.","I invite unbelievers to accept Christ as their Savior.","I trust God in circumstances where success cannot be guaranteed by human effort alone.","I am challenged to limit my lifestyle in order to give away a higher percentage of my income.","I see spiritual significance in doing practical tasks.","I like to create a place where people do not feel that they are alone.","I pray with confidence because I know that God works in response to prayer.","I have insights or know something to be true.","I set goals and manage people and resources effectively to accomplish them.","I have great compassion for hurting people.","I see most actions as right or wrong, and feel the need to correct the wrong.","I can faithfully provide long-term support and concern for others.","I like to take a systematic approach to my study of the Bible.","I can anticipate the likely consequences of an individual's or a group's actions.","I like to help organizations or groups become more efficient.","I can relate to others in culturally sensitive ways.","I honor God with my handcrafted gifts.","I apply various artistic expressions to communicate God's truth.","I receive affirmation from others concerning the reliability of my insights or perceptions.","I strengthen those who are wavering in their faith.","I openly tell people that I am a Christian and want them to ask me about my faith.","I am convinced of God's daily presence and action in my life.","I like knowing that my financial support makes a real difference in the lives and ministries of God's people.","I like to find small things that need to be done and often do them without being asked.","I enjoy entertaining people and opening my home to others.","When I hear about needy situations, I feel burdened and pray.","I have suddenly known some things about others, but did not know how I knew them.","I influence others to perform to the best of their capability.","I can look beyond a person's handicaps or problems to see a life that matters to God.","I like people who are honest and will speak the truth.","I enjoy giving guidance and practical support to a small group of people.","I can communicate Scriptures in ways that motivate others to study and want to learn more.","I give practical advice to help others through complicated situations.","I enjoy learning about how organizations function.","I enjoy pioneering new undertakings.","I am good at and enjoy working with my hands.","I am creative and imaginative.","I can identify preaching, teaching, or communication which is not true to the Bible.","I like motivating others to take steps for spiritual growth.","I openly and confidently tell others what Christ has done for me.","I am regularly challenging others to trust God.","I give generously due to my commitment to stewardship.","I feel comfortable being a helper, assisting others to do their job more effectively.","I do whatever I can to make people feel that they belong.","I am honored when someone asks me to pray for them.","I discover important biblical truths when reading or studying Scriptures which benefit others in the body of Christ.","I am able to cast a vision that others want to be a part of.","I enjoy bringing hope and joy to people living in difficult circumstances.","I will speak God's truth, even in places where it is unpopular or difficult for others to accept.","I can gently restore wandering believers to faith and fellowship.","I can present information and skills to others at a level that makes it easy for them to grasp and apply to their lives.","I can apply scriptural truth that others regard as practical and helpful.","I can visualize a coming event, anticipate potential problems, and develop backup plans.","I am able to orchestrate or oversee several church ministries.","I am able to design and construct things that help the church.","I regularly need to get alone to reflect and develop my imagination.","I can sense when demonic forces are at work in a person or situation.","I am able to challenge or rebuke others in order to foster spiritual growth.","I seek opportunities to talk about spiritual matters with unbelievers.","I can move forward in spite of opposition or lack of support when I sense God's blessing on an undertaking.","I believe I have been given an abundance of resources so that I may give more to the Lord's work.","I readily and happily use my natural or learned skills to help wherever needed.","I can make people feel at ease even in unfamiliar surroundings.","I often see specific results in direct response to my prayers.","I confidently share my knowledge and insights with others.","I figure out where we need to go and help others to get there.","I enjoy doing practical things for others who are in need.","I feel compelled to expose sin wherever I see it and to challenge people to repentance.","I enjoy patiently but firmly nurturing others in their development as believers.","I enjoy explaining things to people so that they can grow spiritually and personally.","I have insights into how to solve problems that others do not see."];
const HQ={en:[{id:"h1",txt:"I am willing to serve in a role that nobody notices, recognizes, or applauds.",pr:"Humility"},{id:"h2",txt:"When in a leadership role, I think first about what others need — not what benefits me.",pr:"Others First"},{id:"h3",txt:"I am comfortable picking up the towel — even when it means doing lowly or unglamorous tasks.",pr:"Taking Up the Towel"},{id:"h4",txt:"I follow God's direction for my life and ministry, even when it stretches or challenges me.",pr:"Following God's Vision"},{id:"h5",txt:"I intentionally build up and encourage other leaders around me, rather than leading alone.",pr:"Building a Team"},{id:"h6",txt:"I freely share my resources, skills, and time for the work of God's kingdom.",pr:"Sharing Resources"},{id:"h7",txt:"I am willing to step out in faith for God's purposes, even when the outcome is uncertain.",pr:"Taking Faith Risks"}],tl:[{id:"h1",txt:"Handa akong maglingkod sa isang papel na walang nakakakita, nakakakilala, o pumupuri.",pr:"Kababaang-loob"},{id:"h2",txt:"Kapag nangunguna ako, una kong iniisip ang pangangailangan ng iba — hindi ang sa akin.",pr:"Una ang Iba"},{id:"h3",txt:"Komportable akong kumuha ng tuwalya — kahit nangangailangan ito ng simpleng o walang karangalang gawain.",pr:"Pagkuha ng Tuwalya"},{id:"h4",txt:"Sinusunod ko ang gabay ng Diyos para sa aking buhay at ministeryo, kahit nahihirapan ako.",pr:"Pagsunod sa Bisyon ng Diyos"},{id:"h5",txt:"Sinasadya kong itayo at palakasin ang iba pang mga lider sa aking paligid.",pr:"Pagbuo ng Koponan"},{id:"h6",txt:"Malaya akong nagbabahagi ng aking mga mapagkukunan, kakayahan, at oras para sa Kaharian ng Diyos.",pr:"Pagbabahagi ng Mapagkukunan"},{id:"h7",txt:"Handa akong humakbang sa pananampalataya para sa mga layunin ng Diyos, kahit hindi sigurado ang kinalabasan.",pr:"Panganib sa Pananampalataya"}]};
const PRF={A:{en:{s:"The Faithful Steward",d:"God has gifted you with the rare ability to bring order, clarity, and excellence to everything you touch. Like Nehemiah who organized an entire city's rebuilding with strategy and prayer, you help turn God's vision into practical reality. Behind every thriving ministry is someone like you — faithful, organized, and deeply committed to doing things well for God's glory.",v:"\"For God is not a God of disorder but of peace.\" — 1 Corinthians 14:40",tc:"Practice serving without directing. Find one task where someone else leads and support them fully — without suggesting how they could do it better. Let God use you as a foundation, not a foreman.",mini:["Admin/Logistics","Fellowship","Worship Team"],enc:"The church moves forward because of people like you who show up, plan well, and quietly hold everything together — keep going, kapatid."},tl:{s:"Ang Tapat na Katiwala",d:"Pinagkalooban ka ng Diyos ng bihirang kakayahang magdala ng kaayusan, linaw, at kahusayan sa lahat ng iyong ginagawa. Tulad ni Nehemias na nag-organisa ng muling pagtatayo ng buong lungsod sa pamamagitan ng estratehiya at panalangin, tinutulungan mo ang bisyon ng Diyos na maging katotohanang-praktikal. Sa likod ng bawat maunlad na ministeryo ay may isang katulad mo — tapat, organisado, at lubos na nakatuon sa paggawa ng mga bagay nang maayos para sa kaluwalhatian ng Diyos.",v:"\"Sapagka't ang Dios ay hindi Dios ng kaguluhan, kundi ng kapayapaan.\" — 1 Corinto 14:40",tc:"Magsanay ng paglilingkod nang hindi nangunguna. Hanapin ang isang gawaing pinamumunuan ng iba at suportahan sila nang buong-buo — nang hindi nagmumungkahi kung paano nila ito mas magagawa. Hayaang gamitin ka ng Diyos bilang pundasyon, hindi bilang direktor.",mini:["Admin/Logistics","Fellowship","Worship Team"],enc:"Sumusulong ang simbahan dahil sa mga katulad mo na nagpapakita, nagpaplano nang maayos, at tahimik na nagtataglay ng lahat — magpatuloy, kapatid."}},B:{en:{s:"The Kingdom Pioneer",d:"God has placed a pioneering spirit within you — a holy restlessness for people and communities not yet reached by the Gospel. Like Paul who crossed seas and cultures to plant churches, you carry a burden for the unreached. As a Filipino OFW in Kuwait, you are already living the apostolic calling — you ARE the missionary.",v:"\"How beautiful are the feet of those who bring good news!\" — Romans 10:15",tc:"The greatest challenge for pioneers is staying long enough to let roots grow. Choose one person in FLCC to invest in consistently — not just broadly reaching, but deeply walking with one soul.",mini:["Outreach/Evangelism","Fellowship","Youth & Children"],enc:"You didn't end up in Kuwait by accident — God sent you here as His ambassador, and the harvest around you is greater than you know."},tl:{s:"Ang Pioneer ng Kaharian",d:"Naglagay ang Diyos ng espiritu ng pioneer sa iyo — isang banal na pagkabalisa para sa mga tao at komunidad na hindi pa naaabot ng Ebanghelyo. Tulad ni Pablo na tumawid ng mga dagat at kultura upang magtanim ng mga simbahan, nagdadala ka ng pasan para sa mga hindi pa naaabot. Bilang Filipino OFW sa Kuwait, nabubuhay ka na sa apostolikong tawag — ikaw ANG misyonero.",v:"\"Pagkaganda ng mga paa ng mga nagdadala ng masasayang balita!\" — Roma 10:15",tc:"Ang pinakamahirap na hamon para sa mga pioneer ay ang manatili nang matagal upang lumago ang mga ugat. Pumili ng isang tao sa FLCC na pag-uukunan mo nang tuluy-tuloy — hindi lamang malapad na pag-abot, kundi malalim na paglakad kasama ang isang kaluluwa.",mini:["Outreach/Evangelism","Fellowship","Youth & Children"],enc:"Hindi ka nakarating sa Kuwait nang aksidente — ipinadala ka ng Diyos dito bilang Kanyang kinatawan, at ang ani sa paligid mo ay mas malaki kaysa sa alam mo."}},C:{en:{s:"The Builder for God",d:"Your hands are an act of worship. Like Bezalel in Exodus whom God filled with skill and ability in all kinds of crafts to build the tabernacle, you are called to create things that serve God's purposes. Every structure you build for the kingdom carries eternal weight — don't underestimate the holiness of your hands.",v:"\"I have filled him with the Spirit of God, with wisdom, with understanding, with knowledge and with all kinds of skills.\" — Exodus 31:3",tc:"Those with craftsmanship gifts often serve quietly and feel overlooked. This week, identify one practical need in the church and offer your skills freely, with no expectation of recognition.",mini:["Admin/Logistics","Media/Tech","Hospitality/Ushering"],enc:"The church needs builders, fixers, and makers — God has specifically equipped your hands to serve His house. Offer what you have, and watch Him multiply it."},tl:{s:"Ang Tagagawa para sa Diyos",d:"Ang iyong mga kamay ay isang gawa ng pagsamba. Tulad ni Bezaleel sa Exodo na pinuno ng Diyos ng kasanayan at kakayahan sa lahat ng uri ng pag-ukit upang itayo ang tabernakulo, ikaw ay tinawag upang lumikha ng mga bagay na nagsisilbi sa mga layunin ng Diyos. Bawat estruktura na iyong itinatayo para sa kaharian ay may walang hanggang bigat — huwag maliitin ang kabanalan ng iyong mga kamay.",v:"\"Pinuno ko siya ng Espiritu ng Diyos, ng karunungan, ng pag-unawa, ng kaalaman at ng lahat ng uri ng kasanayan.\" — Exodo 31:3",tc:"Ang mga may kaloob ng craftsmanship ay naglilingkod nang tahimik at nakakaramdam na hindi pinapansin. Tukuyin ang isang praktikal na pangangailangan sa simbahan at alok ang iyong mga kasanayan nang malaya, nang walang inaasahang pagkilala.",mini:["Admin/Logistics","Media/Tech","Hospitality/Ushering"],enc:"Kailangan ng simbahan ang mga nagtatayo, nagkukumpuni, at gumagawa — ginawa ng Diyos ang iyong mga kamay para paglingkuran ang Kanyang tahanan. Alok ang mayroon ka at panoorin Siyang dumami nito."}},D:{en:{s:"The Creative Voice",d:"God speaks through your creativity. Like David who worshiped through music and poetry, your artistic gifts open hearts to truths that words alone cannot reach. In a world drowning in noise, your creative voice can cut through and point people to Jesus in ways that logic and argument never could.",v:"\"Praise him with the sounding of the trumpet, praise him with the harp and lyre, praise him with dancing.\" — Psalm 150:3-4",tc:"Creative people can sometimes serve their art more than their community. This week, use your creative gift specifically for one other person — make or create something entirely for their encouragement.",mini:["Worship Team","Media/Tech","Youth & Children"],enc:"The world is full of noise — your God-given creativity is the kind of signal that cuts through it all. Don't hold back what God has given you."},tl:{s:"Ang Malikhain",d:"Nagsasalita ang Diyos sa pamamagitan ng iyong pagkamalikhain. Tulad ni David na sumamba sa pamamagitan ng musika at tula, ang iyong mga artistikong kaloob ay nagbubukas ng mga puso sa mga katotohanang hindi lubos na maipahayag ng mga salita lamang. Sa isang mundong nalulunod sa ingay, ang iyong malikhain na boses ay maaaring tumawid at ituro ang mga tao kay Hesus.",v:"\"Purihin siya sa tunog ng trumpeta, purihin siya ng alpa at lira, purihin siya ng sayaw.\" — Awit 150:3-4",tc:"Minsan ang mga malikhain ay naglilingkod sa kanilang sining nang higit sa kanilang komunidad. Sa linggong ito, gamitin ang iyong malikhain na kaloob nang espesipiko para sa isang ibang tao — gumawa ng isang bagay para lamang sa kanilang pagpapalakas ng loob.",mini:["Worship Team","Media/Tech","Youth & Children"],enc:"Puno ng ingay ang mundo — ang iyong Diyos-ibinigay na pagkamalikhain ang uri ng senyales na tumutawid sa lahat nito. Huwag pigilan ang ibinigay sa iyo ng Diyos."}},E:{en:{s:"The Watchman",d:"God has given you spiritual eyes that see what others cannot. Like the Bereans who tested everything against scripture, you have a God-given ability to sense when something is spiritually right or wrong before others realize it. This is not a gift for pride — it is a protective gift given for the safety of the whole church.",v:"\"Dear friends, do not believe every spirit, but test the spirits to see whether they are from God.\" — 1 John 4:1",tc:"Discernment without love can become judgmental. Every time you sense something is wrong about a person, pause and pray for them first before you speak. Let love lead your truth.",mini:["Prayer Ministry","Worship Team","Fellowship"],enc:"The church needs watchmen who love deeply enough to guard carefully — your eyes and your prayers are a covering over this congregation."},tl:{s:"Ang Bantay",d:"Binigyan ka ng Diyos ng espirituwal na mga mata na nakakakita ng hindi makita ng iba. Tulad ng mga Bereo na sinubok ang lahat laban sa kasulatan, mayroon kang kaloob mula sa Diyos na maramdaman kung ang isang bagay ay espirituwal na tama o mali bago pa mapagtanto ng iba. Hindi ito kaloob para sa pagmamalaki — ito ay isang protektibong kaloob na ibinigay para sa kaligtasan ng buong simbahan.",v:"\"Mga kaibigan, huwag maniwala sa bawat espiritu, kundi subukin ang mga espiritu kung sila'y mula sa Diyos.\" — 1 Juan 4:1",tc:"Ang Discernment nang walang pagmamahal ay maaaring maging mapaghatol. Sa tuwing mararamdaman mo ang mali sa isang tao, ihinto at ipanalangin sila muna bago ka magsalita. Hayaang ang pagmamahal ang manguna sa iyong katotohanan.",mini:["Prayer Ministry","Worship Team","Fellowship"],enc:"Kailangan ng simbahan ang mga bantay na nagmamahal nang sapat upang mag-ingat nang maingat — ang iyong mga mata at iyong mga panalangin ay isang takip sa kongregasyong ito."}},F:{en:{s:"The Encourager",d:"Like Barnabas — whose very name means Son of Encouragement — you have an extraordinary ability to see the best in people and call it out of them. In a community of OFWs who carry loneliness and sacrifice daily, your gift is not just helpful — it is essential. You carry the ministry of the Holy Spirit's comfort in your words and your presence.",v:"\"Therefore encourage one another and build each other up, just as in fact you are doing.\" — 1 Thessalonians 5:11",tc:"Encouragers can avoid difficult conversations to keep peace. This week, ask God for the courage to speak one honest, loving truth to someone who needs it — not just the comfortable word, but the right word.",mini:["Fellowship","Youth & Children","Outreach/Evangelism"],enc:"Never underestimate the power of your presence — you carry the atmosphere of heaven into every room you walk into, and people are different because of you."},tl:{s:"Ang Tagahikayat",d:"Tulad ni Barnabas — na ang mismong pangalan ay nangangahulugang Anak ng Pagpapalakas ng Loob — mayroon kang pambihirang kakayahang makita ang pinakamahusay sa mga tao at tawagan ito mula sa kanila. Sa isang komunidad ng mga OFW na nagdadala ng kalungkutan at sakripisyo araw-araw, ang iyong kaloob ay hindi lamang nakatutulong — ito ay mahalaga. Dala mo ang ministeryo ng kaginhawaan ng Banal na Espiritu sa iyong mga salita at presensya.",v:"\"Kaya't palakasin ninyo ang isa't isa at itayo ang bawat isa, tulad ng inyong ginagawa.\" — 1 Tesalonica 5:11",tc:"Ang mga Tagahikayat ay maaaring umiiwas sa mahihirap na pag-uusap upang mapanatili ang kapayapaan. Hilingin sa Diyos ang lakas ng loob na sabihin ang isang tapat, mapagmahal na katotohanan sa isang taong nangangailangan nito — hindi lamang ang komportableng salita, kundi ang tamang salita.",mini:["Fellowship","Youth & Children","Outreach/Evangelism"],enc:"Huwag kailanman maliitin ang kapangyarihan ng iyong presensya — dala mo ang kapaligiran ng langit sa bawat silid na pinapasok mo, at ang mga tao ay nagbabago dahil sa iyo."}},G:{en:{s:"The Evangelist",d:"Like Philip who ran alongside the Ethiopian official without hesitation, you carry a God-given fire to share the Good News. You have a natural ability to make the Gospel clear, relevant, and personal. As a Filipino OFW in Kuwait, you are already placed in one of the most strategic mission fields on earth — your workplace is your pulpit.",v:"\"You will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the ends of the earth.\" — Acts 1:8",tc:"Evangelists can focus so much on reaching new people that they neglect to disciple those already reached. Follow up on one person you've already shared the Gospel with — water the seed you've already planted.",mini:["Outreach/Evangelism","Fellowship","Youth & Children"],enc:"You are God's ambassador in Kuwait — every conversation is a divine appointment, and every relationship is a door He has opened for you."},tl:{s:"Ang Ebanghelista",d:"Tulad ni Felipe na tumakbo kasabay ng karwahe ng opisyal na Etiopiko nang walang pag-aalangan, nagdadala ka ng apoy mula sa Diyos upang ibahagi ang Magandang Balita. Mayroon kang natural na kakayahang gawing malinaw, may kaugnayan, at personal ang Ebanghelyo. Bilang Filipino OFW sa Kuwait, nakapwesto ka na sa isa sa pinaka-estratehikong larangan ng misyon sa mundo — ang iyong lugar ng trabaho ay ang iyong pulpito.",v:"\"Kayo'y magiging mga saksi ko sa Jerusalem, at sa buong Judea at Samaria, at hanggang sa dulo ng lupa.\" — Gawa 1:8",tc:"Ang mga Ebanghelista ay maaaring nakatutok nang husto sa pag-abot sa mga bagong tao na napapabayaan ang pagdidisipulo sa mga naabot na. Makipag-ugnayan sa isang taong ibinahagian mo na ng Ebanghelyo — diligan ang binhing iyong itinatanim na.",mini:["Outreach/Evangelism","Fellowship","Youth & Children"],enc:"Ikaw ang kinatawan ng Diyos sa Kuwait — bawat pag-uusap ay isang banal na tipanan, at bawat relasyon ay isang pintuan na Kanyang binuksan para sa iyo."}},H:{en:{s:"The Intercessor of Faith",d:"Your faith moves mountains. Like George Müller who prayed in provision for thousands without asking a single person for money, or like Elijah who called down rain after three years of drought, you believe God for the impossible — and God honors that trust consistently.",v:"\"Now faith is confidence in what we hope for and assurance about what we do not see.\" — Hebrews 11:1",tc:"Those with great faith can run ahead of the community, making declarations others aren't ready for. Practice faith that invites others along — share what you're believing God for, and let others join you in trusting Him together.",mini:["Prayer Ministry","Worship Team","Outreach/Evangelism"],enc:"Your faith is a covering over this congregation — keep praying, keep believing, because God is moving in response to your trust in Him."},tl:{s:"Ang May Pananampalatayang Mananalangin",d:"Ang iyong pananampalataya ay gumagalaw ng mga bundok. Tulad ni George Müller na ipinanalangin ang pagkain para sa libu-libo nang hindi humingi sa kahit sino, o tulad ni Elias na tumawag ng ulan pagkatapos ng tatlong taon ng tagtuyot, naniniwala ka sa Diyos para sa imposible — at patuloy na kinikilala ng Diyos ang pagtitiwalang iyon.",v:"\"Ngayon ang pananampalataya ay katiyakan sa mga bagay na inaasahan, katibayan ng mga bagay na hindi nakikita.\" — Hebreo 11:1",tc:"Ang mga may dakilang pananampalataya ay maaaring mauna sa komunidad, gumagawa ng mga deklarasyon na hindi pa handa ang iba. Magsanay ng pananampalatayang nag-iimbita sa iba — ibahagi ang iyong pinananalig sa Diyos, at hayaang sumali ang iba.",mini:["Prayer Ministry","Worship Team","Outreach/Evangelism"],enc:"Ang iyong pananampalataya ay isang takip sa kongregasyong ito — magpatuloy sa pagdaralangin, magpatuloy sa paniniwala, sapagkat gumagalaw ang Diyos bilang tugon sa iyong tiwala sa Kanya."}},I:{en:{s:"The Generous Giver",d:"Like the widow who gave her two small coins — you understand at a deep level that generosity is an act of faith, not abundance. God has wired you to hold loosely the things of this world and give freely for His kingdom. Your faithfulness with money is a form of worship that moves heaven.",v:"\"Each of you should give what you have decided in your heart to give, not reluctantly or under compulsion, for God loves a cheerful giver.\" — 2 Corinthians 9:7",tc:"The gift of Giving can sometimes be used to maintain control or to feel needed. Give something of value anonymously this week — where no one will know it was you. Let that gift be purely between you and God.",mini:["Admin/Logistics","Fellowship","Outreach/Evangelism"],enc:"Every peso you give in faith is an investment in eternity — God sees every sacrifice, especially the ones no one else notices."},tl:{s:"Ang Mapagbigay",d:"Tulad ng biyudang nagbigay ng kanyang dalawang maliit na barya — nauunawaan mo sa malalim na antas na ang pagiging mapagbigay ay isang gawa ng pananampalataya, hindi ng kasaganaan. Ginawa ka ng Diyos upang hawakan nang maluwag ang mga bagay ng mundong ito at magbigay nang malaya para sa Kanyang kaharian. Ang iyong katapatan sa pera ay isang anyo ng pagsamba na gumagalaw sa langit.",v:"\"Ang bawat isa sa inyo ay magbigay ng ayon sa itinakda ng kanyang puso, hindi nang may pag-aalangan o nang sapilitan; sapagka't ang Dios ay umiibig sa nagbibigay na masaya.\" — 2 Corinto 9:7",tc:"Ang kaloob ng Pagbibigay ay maaaring gamitin upang mapanatili ang kontrol. Magbigay ng isang bagay na may halaga nang hindi kilala ang nagbibigay ngayong linggo — kung saan walang makakaalam na ikaw. Hayaang ang handing iyon ay maging puro sa pagitan mo at ng Diyos.",mini:["Admin/Logistics","Fellowship","Outreach/Evangelism"],enc:"Bawat pisong ibinibigay mo sa pananampalataya ay isang pamumuhunan sa walang hanggan — nakikita ng Diyos ang bawat sakripisyo, lalo na ang mga hindi napapansin ng iba."}},J:{en:{s:"The Faithful Helper",d:"Like Epaphras who labored quietly behind the scenes so that Paul could preach and plant churches, you have genuine joy in making others succeed. You are not interested in the spotlight — you are interested in the work getting done. This kind of service is the very foundation Jesus described: the greatest in the kingdom is the servant of all.",v:"\"Whoever wants to become great among you must be your servant, just as the Son of Man did not come to be served, but to serve.\" — Matthew 20:26,28",tc:"Those with the Helps gift can do so much for others that they enable dependency rather than growth. Instead of doing a task for someone, teach or walk alongside them so they can do it themselves next time.",mini:["Admin/Logistics","Hospitality/Ushering","Fellowship"],enc:"The church stands because of people like you who show up without applause, do the work without recognition, and serve without stopping — you are seen by God and deeply valued here."},tl:{s:"Ang Tapat na Katulong",d:"Tulad ni Epaphras na nagpakabusabos nang tahimik sa likod ng eksena upang maaaring mangaral si Pablo, mayroon kang tunay na kagalakan sa paggawa ng tagumpay ng iba. Hindi ka interesado sa spotlight — interesado ka sa pagkakumpleto ng trabaho. Ang ganitong uri ng paglilingkod ang mismong pundasyon na inilarawan ni Hesus: ang pinakadakila sa kaharian ay ang lingkod ng lahat.",v:"\"Ang sinomang nagnanais na maging dakila sa inyo ay magiging inyong lingkod, tulad ng Anak ng Tao na hindi naparito upang paglingkuran, kundi upang maglingkod.\" — Mateo 20:26,28",tc:"Ang mga may kaloob ng Pagttulong ay maaaring gumagawa ng napakaraming bagay para sa iba na nagbibigay ng pagkakataon sa pag-asa sa halip na paglago. Sa halip na gumawa ng isang gawain para sa isang tao, turuan o lakad kasama sila upang magawa nila ito mismo sa susunod.",mini:["Admin/Logistics","Hospitality/Ushering","Fellowship"],enc:"Nakatayo ang simbahan dahil sa mga katulad mo na nagpapakita nang walang palakpakan, gumagawa nang walang pagkilala, at naglilingkod nang walang tigil — nakikita ka ng Diyos at lubos na pinahahalagahan dito."}},K:{en:{s:"The Welcome Host",d:"Like Lydia who immediately opened her home to Paul's entire team, you create environments where people instantly feel they belong. For OFWs far from home and family, your gift of hospitality is not just warmth — it is healing. You bring the Father's welcome into every space you enter.",v:"\"Offer hospitality to one another without grumbling. Each of you should use whatever gift you have received to serve others.\" — 1 Peter 4:9-10",tc:"Hospitality can become people-pleasing — creating comfort at the expense of truth. Welcome someone who is difficult to welcome this week — someone on the edges of the community, not just those who are easy to host.",mini:["Hospitality/Ushering","Fellowship","Youth & Children"],enc:"Every person who walks through our church doors and feels welcomed — that is your gift working, and it has eternal impact far beyond what you see."},tl:{s:"Ang Matanggap na Host",d:"Tulad ni Lydia na agad na nagbukas ng kanyang tahanan sa buong koponan ni Pablo, lumilikha ka ng mga kapaligiran kung saan ang mga tao ay agad na nakakaramdam na sila ay kabilang. Para sa mga OFW na malayo sa tahanan at pamilya, ang iyong kaloob ng pagiging mapagpatanggap ay hindi lamang init — ito ay pagpapagaling. Dina-dala mo ang pagtanggap ng Ama sa bawat espasyong pinasok mo.",v:"\"Mag-alok ng pagiging mapagpatanggap sa isa't isa nang walang pagbubulong-bulungan. Ang bawat isa sa inyo ay dapat gumamit ng anumang kaloob na natanggap niya upang paglingkuran ang iba.\" — 1 Pedro 4:9-10",tc:"Ang Hospitality ay maaaring maging pagiging mapagpagaan ng loob ng tao — paglikha ng kaginhawahan sa gastos ng katotohanan. Tanggapin ang isang taong mahirap tanggapin ngayong linggo — isang tao sa gilid ng komunidad, hindi lamang ang mga madaling patanggapin.",mini:["Hospitality/Ushering","Fellowship","Youth & Children"],enc:"Bawat taong lumapit sa mga pinto ng aming simbahan at nakakaramdam ng pagtanggap — iyon ang iyong kaloob na gumagana, at ito ay may walang hanggang epekto na higit pa sa nakikita mo."}},L:{en:{s:"The Prayer Warrior",d:"Like Anna who prayed and fasted in the temple for decades, or like the early church that prayed through the night for Peter's miraculous release — intercession is your sacred post. You feel the weight of what others carry. Your prayers are not a last resort; they are the first line of defense for this congregation.",v:"\"The prayer of a righteous person is powerful and effective.\" — James 5:16",tc:"Intercessors can substitute prayer for action. After you pray for someone, take one small practical step to also serve them — let your prayers have hands and feet.",mini:["Prayer Ministry","Worship Team","Outreach/Evangelism"],enc:"Things are happening in the spirit because you are praying — don't stop, don't grow weary, and don't ever underestimate what God is doing through your faithful intercession."},tl:{s:"Ang Mandirigmang Nananalangin",d:"Tulad ni Ana na nanalangin at nag-ayuno sa templo sa loob ng mga dekada, o tulad ng maagang simbahan na nanalangin sa buong gabi para sa kamangha-manghang paglabas ni Pedro mula sa bilangguan — ang panalangin ay ang iyong sagradong post. Nararamdaman mo ang bigat ng dala ng iba. Ang iyong mga panalangin ay hindi huling paraan; ang mga ito ay unang linya ng depensa para sa kongregasyong ito.",v:"\"Ang taimtim na panalangin ng matuwid ay lubhang makapangyarihan.\" — Santiago 5:16",tc:"Ang mga Intercessors ay maaaring pumalit ng panalangin sa kilos. Pagkatapos mong ipanalangin ang isang tao, gumawa ng isang maliit na praktikal na hakbang upang paglingkuran din sila — hayaang ang iyong mga panalangin ay magkaroon ng mga kamay at paa.",mini:["Prayer Ministry","Worship Team","Outreach/Evangelism"],enc:"Nagaganap ang mga bagay sa espiritu dahil nanalangin ka — huwag huminto, huwag mapagod, at huwag kailanman maliitin ang ginagawa ng Diyos sa pamamagitan ng iyong tapat na panalangin."}},M:{en:{s:"The Knowledge Bearer",d:"God deposits truth in you that others desperately need. Like the disciples who marveled at how Jesus handled the Word, you have a Spirit-given capacity to receive and communicate divine knowledge. Your insights are not just intellectual — they carry spiritual weight and life-changing power.",v:"\"The secret things belong to the Lord our God, but the things revealed belong to us and to our children forever.\" — Deuteronomy 29:29",tc:"The gift of Knowledge without love can become intellectual pride. Share one insight you've received with someone specifically to serve them — not to impress them, but to genuinely meet a need they have.",mini:["Admin/Logistics","Fellowship","Youth & Children"],enc:"What God has deposited in you is not just for you — it is treasure for the whole church, and there are people here waiting to hear what He has shown you."},tl:{s:"Ang Tagapagdalang Kaalaman",d:"Naglalagak ang Diyos ng katotohanang desperadong kailangan ng iba sa iyo. Tulad ng mga alagad na humanga kung paano pinangasiwaan ni Hesus ang Salita, mayroon kang kapasidad na ibinigay ng Espiritu upang tumanggap at maiparating ang banal na kaalaman. Ang iyong mga pananaw ay hindi lamang intelektwal — nagdadala ng espirituwal na bigat at kapangyarihang nagbabago ng buhay.",v:"\"Ang mga lihim na bagay ay sa Panginoon nating Dios; ngunit ang mga bagay na nahayag ay sa atin at sa ating mga anak magpakailan man.\" — Deuteronomio 29:29",tc:"Ang kaloob ng Kaalaman nang walang pagmamahal ay maaaring maging intelektwal na pagmamalaki. Ibahagi ang isang pananaw na iyong natanggap sa isang tao nang espesipiko upang paglingkuran sila — hindi upang impress sila, kundi upang tunay na matugunan ang isang pangangailangan nila.",mini:["Admin/Logistics","Fellowship","Youth & Children"],enc:"Ang inilagak ng Diyos sa iyo ay hindi para lamang sa iyo — ito ay kayamanan para sa buong simbahan, at may mga taong naghihintay na marinig ang ipinakita Niya sa iyo."}},N:{en:{s:"The Vision Carrier",d:"Like Nehemiah who saw the rebuilt walls of Jerusalem before a single stone had been moved, God has placed leadership vision in you. People naturally look to you for direction, and when you speak, things move. This is not a gift for personal ambition — it is a stewardship entrusted to you for the blessing of the whole community.",v:"\"Where there is no vision, the people perish.\" — Proverbs 29:18 (KJV)",tc:"Leaders can move so fast toward the vision that they leave people behind. This week, personally check in with someone who seems to be struggling to keep up — lead them, not just the vision.",mini:["Admin/Logistics","Fellowship","Youth & Children"],enc:"God gave you this gift of leadership not for your comfort but for His kingdom — step forward boldly, serve humbly, and watch God multiply what you carry."},tl:{s:"Ang Nagdadala ng Bisyon",d:"Tulad ni Nehemias na nakita ang muling itinayong mga pader ng Jerusalem bago pa man gumalaw ang isang bato, naglagay ng bisyon ng pamumuno ang Diyos sa iyo. Natural na tumitingin ang mga tao sa iyo para sa direksyon, at kapag nagsalita ka, gumagalaw ang mga bagay. Hindi ito kaloob para sa personal na ambisyon — ito ay isang katiwalaang ipinagkatiwala sa iyo para sa pagpapala ng buong komunidad.",v:"\"Kung walang pangitain ang bayan ay napapahamak.\" — Kawikaan 29:18",tc:"Ang mga lider ay maaaring gumalaw nang napakabilis patungo sa bisyon na nag-iiwan ng mga tao. Personal na makipag-usap sa isang taong tila nahihirapang makasabay ngayong linggo — pamunuan sila, hindi lamang ang bisyon.",mini:["Admin/Logistics","Fellowship","Youth & Children"],enc:"Ibinigay ng Diyos sa iyo ang kaloob na ito ng pamumuno hindi para sa iyong kaginhawahan kundi para sa Kanyang kaharian — humakbang nang matapang, maglingkod nang mapagkumbaba."}},O:{en:{s:"The Compassionate Servant",d:"Like the Good Samaritan who crossed every barrier to care for the one everyone else passed by, your mercy is a living revelation of the Father's heart. For OFWs who know what it feels like to be far from help, your compassion bridges the gap between God's love and human pain.",v:"\"And what does the Lord require of you? To act justly and to love mercy and to walk humbly with your God.\" — Micah 6:8",tc:"The gift of Mercy can mean absorbing others' pain without healthy limits. Practice caring with boundaries — offer your compassion fully but point people toward God as their ultimate source of healing, not yourself.",mini:["Outreach/Evangelism","Hospitality/Ushering","Youth & Children"],enc:"Every time you stop for the one that others walk past, you are doing exactly what Jesus did — and that is never, ever small."},tl:{s:"Ang Maawain",d:"Tulad ng Mabuting Samaritano na tumawid sa bawat hadlang upang alagaan ang isang taong nilampasan ng lahat, ang iyong awa ay isang buhay na pahayag ng puso ng Ama. Para sa mga OFW na alam kung ano ang pakiramdam ng malayo sa tulong, ang iyong awa ay nagtatakip ng agwat sa pagitan ng pagmamahal ng Diyos at ng sakit ng tao.",v:"\"At ano ang hinihingi ng Panginoon sa iyo? Ang gumawa ng matuwid, at umiibig sa awa, at lumakad nang may kababaang-loob kasama ang iyong Diyos.\" — Mikas 6:8",tc:"Ang kaloob ng Awa ay maaaring mangahulugang pagsipsip ng sakit ng iba nang walang malusog na hangganan. Magsanay ng pag-aalaga na may hangganan — ibigay ang iyong awa nang buong-buo ngunit ituro ang mga tao sa Diyos bilang kanilang pinakamataas na pinagmulan ng pagpapagaling, hindi ang iyong sarili.",mini:["Outreach/Evangelism","Hospitality/Ushering","Youth & Children"],enc:"Sa tuwing humihinto ka para sa isang taong nilalampasan ng iba, ginagawa mo nang eksakto ang ginawa ni Hesus — at hindi iyon kailanman maliit."}},P:{en:{s:"The Bold Voice",d:"Like Jeremiah who declared he could not hold God's word back even when it cost him greatly, you carry a holy fire to declare God's truth with clarity and courage. You see what is wrong and feel compelled to say so. This is not a flaw — it is a prophetic gift the church desperately needs, when covered in love.",v:"\"His word is in my heart like a fire, a fire shut up in my bones. I am weary of holding it in; indeed, I cannot.\" — Jeremiah 20:9",tc:"The prophetic gift without compassion can wound rather than heal. Before you speak a truth you feel compelled to share, ask yourself: 'Is this for their restoration, or for my satisfaction?' Let love be the filter.",mini:["Outreach/Evangelism","Fellowship","Prayer Ministry"],enc:"The church needs your voice — not louder, but deeper in love. When truth and compassion flow together through you, lives are genuinely transformed."},tl:{s:"Ang Matapang na Boses",d:"Tulad ni Jeremias na nagsabing hindi niya mapipigilan ang Salita ng Diyos kahit na malaki ang gastos sa kanya, nagdadala ka ng banal na apoy upang ipahayag ang katotohanan ng Diyos nang may linaw at lakas ng loob. Nakikita mo kung ano ang mali at nadarama mong kailangang sabihin ito. Hindi ito depekto — ito ay isang propetikong kaloob na desperadong kailangan ng simbahan, kapag nasasaklaw ng pagmamahal.",v:"\"Ang kanyang salita ay nasa aking puso na parang apoy, isang apoy na nakasarado sa aking mga buto. Pagod na akong pigilin ito; katotohanan, hindi ko kaya.\" — Jeremias 20:9",tc:"Ang propetikong kaloob nang walang awa ay maaaring manakit sa halip na magpagaling. Bago ka magsalita ng katotohanang nadarama mong kailangang ibahagi, tanungin ang iyong sarili: 'Ito ba ay para sa kanilang pagpapanumbalik, o para sa aking kasiyahan?' Hayaang ang pagmamahal ang maging salaan.",mini:["Outreach/Evangelism","Fellowship","Prayer Ministry"],enc:"Kailangan ng simbahan ang iyong boses — hindi mas malakas, kundi mas malalim sa pagmamahal. Kapag ang katotohanan at awa ay dumadaloy nang magkasama sa pamamagitan mo, ang mga buhay ay tunay na nababago."}},Q:{en:{s:"The Faithful Shepherd",d:"Like Timothy who genuinely cared for the wellbeing of the Philippian believers, you have a God-given heart to walk alongside people through every season of life. You notice when someone is missing. You remember struggles and prayers. Your love for people is not occasional — it is consistent, long-term, and deeply pastoral.",v:"\"Be shepherds of God's flock that is under your care, watching over them — not because you must, but because you are willing.\" — 1 Peter 5:2",tc:"Shepherds can become overprotective, preventing the very growth they want for their flock. Identify one person you've been guiding and intentionally release them to make their own decision — trust that God is also their shepherd.",mini:["Youth & Children","Fellowship","Prayer Ministry"],enc:"The people God has placed in your care are not accidents — He chose you specifically to love and shepherd them, and your faithfulness to that calling changes their lives forever."},tl:{s:"Ang Tapat na Pastor",d:"Tulad ni Timoteo na tunay na nagmalasakit sa kapakanan ng mga mananampalataya sa Filipos, mayroon kang puso mula sa Diyos na sumabay sa mga tao sa bawat panahon ng buhay. Napapansin mo kapag may nawawala. Naaalaala mo ang mga pakikibaka at panalangin. Ang iyong pagmamahal sa mga tao ay hindi paminsan-minsan — ito ay tuluy-tuloy, pangmatagalan, at malalim na pastoral.",v:"\"Kayo'y maging mga pastol ng kawan ng Diyos na nasa inyong pag-aalaga, na nangangasiwa sa kanila — hindi sapagka't kailangan ninyo, kundi sapagka't nais ninyo.\" — 1 Pedro 5:2",tc:"Ang mga pastol ay maaaring maging labis na mapagprotekta, pinipigilan ang mismong paglago na gusto nila para sa kanilang kawan. Tukuyin ang isang taong iyong ginagabayan at sadyang palayain sila upang gumawa ng kanilang sariling desisyon — magtiwala na ang Diyos ay pastol din nila.",mini:["Youth & Children","Fellowship","Prayer Ministry"],enc:"Ang mga taong inilagay ng Diyos sa iyong pag-aalaga ay hindi aksidente — pinili ka Niya nang espesipiko upang mahalin at pangalagaan sila, at ang iyong katapatan sa tawag na iyon ay nagbabago ng kanilang buhay magpakailanman."}},R:{en:{s:"The Teacher",d:"Like Ezra who devoted himself to studying and teaching God's law, your gift of teaching takes the deep truths of God's Word and makes them accessible, practical, and life-changing for ordinary people. You don't just transfer information — you transfer transformation.",v:"\"Ezra had devoted himself to the study and observance of the Law of the Lord, and to teaching its decrees and laws in Israel.\" — Ezra 7:10",tc:"Teachers can prioritize accuracy over relationship — valuing being right more than being heard. Teach someone one-on-one in a conversation rather than a classroom — let your gift serve a relationship, not just a curriculum.",mini:["Youth & Children","Fellowship","Outreach/Evangelism"],enc:"Every time you open God's Word and help someone understand it in a new way, you are planting seeds that will bear fruit for eternity — keep teaching, kapatid."},tl:{s:"Ang Guro",d:"Tulad ni Ezra na nagtukoy ng kanyang sarili sa pag-aaral at pagtuturo ng batas ng Panginoon, ang iyong kaloob ng pagtuturo ay kinukuha ang malalim na katotohanan ng Salita ng Diyos at ginagawang accessible, praktikal, at nagbabago ng buhay para sa mga ordinaryong tao. Hindi ka lamang naglilipat ng impormasyon — naglilipat ka ng pagbabago.",v:"\"Si Ezra ay nagtukoy sa kanyang sarili sa pag-aaral at pagsunod sa Kautusan ng Panginoon, at sa pagtuturo ng mga utos at kautusan nito sa Israel.\" — Ezra 7:10",tc:"Ang mga guro ay maaaring bigyang-priyoridad ang katumpakan kaysa sa relasyon. Magturo sa isang tao nang isa-sa-isa sa isang pag-uusap sa halip na sa isang silid-aralan — hayaang ang iyong kaloob ay maglingkod sa isang relasyon, hindi lamang sa isang kurikulum.",mini:["Youth & Children","Fellowship","Outreach/Evangelism"],enc:"Sa tuwing binubuksan mo ang Salita ng Diyos at tinutulungan ang isang tao na maunawaan ito sa bagong paraan, nagtatatanim ka ng mga binhi na magbubunga sa walang hanggan — magpatuloy sa pagtuturo, kapatid."}},S:{en:{s:"The Wise Counselor",d:"Like Solomon who received divine wisdom to govern with discernment, or like Daniel who could interpret the times and give counsel to kings — you have the rare gift of seeing through life's complexity and applying God's eternal truth to the most tangled and challenging situations. People come to you with unsolvable problems, and somehow you help them find the way forward.",v:"\"If any of you lacks wisdom, you should ask God, who gives generously to all without finding fault, and it will be given to you.\" — James 1:5",tc:"Those with Wisdom can withhold their insight until they have the perfect answer, or share it only when asked. Proactively offer your counsel to someone you sense is struggling — don't wait to be asked. Your wisdom is needed now.",mini:["Admin/Logistics","Fellowship","Prayer Ministry"],enc:"You carry something rare and precious — keep offering it generously, because there are people in this congregation walking in confusion that your one word from God can set free."},tl:{s:"Ang Marunong na Tagapayo",d:"Tulad ni Solomon na nakatanggap ng banal na karunungan para mamuno nang may pagkilatis, o tulad ni Daniel na makaka-interpret ng mga panahon at makakapagbigay ng payo sa mga hari — mayroon kang bihirang kaloob na makita sa pamamagitan ng pagiging kumplikado ng buhay at ilapat ang walang hanggang katotohanan ng Diyos sa pinaka-mahirap na mga sitwasyon. Ang mga tao ay lumapit sa iyo na may mga problemang hindi masolusyunan, at kahit papaano ay tinutulungan mo silang hanapin ang landas patungo.",v:"\"Kung ang sinuman sa inyo ay nagkukulang ng karunungan, siya'y humingi sa Diyos, na nagbibigay ng bukas-palad sa lahat nang walang pagtutuligsa, at ibibigay ito sa kanya.\" — Santiago 1:5",tc:"Ang mga may kaloob ng Karunungan ay maaaring pigilin ang kanilang pananaw hanggang sa mayroon silang perpektong sagot. Aktibong alok ang iyong payo sa isang taong nadarama mong nahihirapan — huwag maghintay na mapagtanungan. Kailangan ang iyong karunungan ngayon.",mini:["Admin/Logistics","Fellowship","Prayer Ministry"],enc:"Dala mo ang isang bagay na bihira at mahalagang — magpatuloy sa pagiging bukas-palad sa pagbibigay nito, sapagkat may mga taong sa kongregasyong ito na naglalakad sa kaguluhan na ang isang salita mo mula sa Diyos ay maaaring magpalaya sa kanila."}}};
const TC={low:{en:"Your Heart Check score suggests this is a real growth area — and that is completely okay. The towel is something Jesus had to consciously pick up too. Ask God this week to show you one specific moment where you held back from serving humbly, and offer that back to Him as a prayer.",tl:"Ang iyong Heart Check score ay nagmumungkahi na ito ay isang tunay na lugar ng paglago para sa iyo — at iyon ay ganap na okay. Ang tuwalya ay isang bagay na kailangang sinadyang kunin ni Hesus din. Hilingin sa Diyos ngayong linggo na ipakita sa iyo ang isang tiyak na sandali kung saan ikaw ay umurong mula sa mapagkumbabang paglilingkod, at ibalik iyon sa Kanya bilang panalangin."},mid:{en:"Your Heart Check shows a growing servant's heart — you understand the towel and are learning to pick it up more consistently. The specific challenge above is your next step of growth this season.",tl:"Ang iyong Heart Check ay nagpapakita na mayroon kang lumalagong puso ng lingkod — naiintindihan mo ang tuwalya at natututo kang kunin ito nang mas tuluy-tuloy. Ang tiyak na hamon sa itaas ay ang iyong susunod na hakbang ng paglago sa panahong ito."},high:{en:"Your Heart Check shows a beautifully surrendered heart. You have genuinely embraced the way of the towel. Your continued challenge is depth — moving from willing service to joyful, sacrificial service that costs you something and fully glorifies God.",tl:"Ang iyong Heart Check ay nagpapakita ng isang magandang puso ng lingkod na nasuko. Tunay mong tinanggap ang daan ng tuwalya. Ang iyong patuloy na hamon ay lalim — pagtahak mula sa handang paglilingkod patungo sa masayang, mapagsakripisyong paglilingkod na nagagastos ka ng isang bagay at lubos na nagpaparangal sa Diyos."}};
function calcScores(ans){const s={};GK.forEach(k=>s[k]=0);QS.forEach((_,i)=>s[GK[i%19]]+=(ans[i]||0));return s;}
function getTop3(s){return Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>({k,v,name:GN[k],emoji:GE[k]}));}
const TX={en:{lb:"Filipino",ch:"FLCC - Farwaniya 1",prv:"🔒 Private reflection tool — your answers are never saved or stored anywhere.",it:"Spiritual Gifts &\nServant Leadership Discovery",iv:"\"For even the Son of Man came not to be served but to serve, and to give his life as a ransom for many.\" — Mark 10:45",id:"Discover how God has uniquely gifted you to serve His church here in Kuwait. This tool uses the full 133-question Spiritual Gifts Assessment followed by a 7-question Heart Check based on Jesus' servant leadership model.",im:"⏱  About 15–20 minutes",is:"Begin My Discovery",ph:["Spiritual Gifts (133 Q)","Heart Check (7 Q)","My Profile"],pt:"Spiritual Gifts Assessment",pn:"Answer as you ARE — not as you wish you were.",sh:["0\nNever","1\nSome-\ntimes","2\nUsually","3\nAlways"],po:(p)=>`Page ${p} of 7 · Q${(p-1)*19+1}–${p*19}`,pw:"⚠️ Please answer all questions on this page before continuing.",nx:"Next Page →",bk:"← Back",ht:"Phase 2: The Heart Check",hv:"\"He got up from the meal, took off his outer clothing, and wrapped a towel around his waist…\" — John 13:4",hs:"Jesus picked up the towel. How ready is your heart to do the same?",hc:["Never","Rarely","Sometimes","Often","Always"],fn:"Reveal My Ministry Profile →",sl:"Your Primary Spiritual Gift",t3:"Your Top 3 Gifts",sc:"All 19 Gift Scores",vl:"Your Anchor Verse",tc:"Your Towel Challenge",ml:"Suggested Ministries For You",el:"A Word For You",ns:"Your Next Step",nt:"Now that you've discovered your profile, go speak to your ministry leader to find out where you can start serving!",ld:"Ptr. Justin Flores  ·  Ptr. Doddie Arciaga",pr:"🖨  Print My Profile",rr:"Take Again",st:["Spiritual Gifts","Heart Check","My Profile"]},tl:{lb:"English",ch:"FLCC - Farwaniya 1",prv:"🔒 Pribadong kagamitan — hindi kailanman sine-save ang iyong mga sagot.",it:"Pagtuklas ng Espirituwal na Kaloob\nat Servant Leadership",iv:"\"Sapagka't ang Anak ng tao ay hindi naparito upang paglingkuran, kundi upang maglingkod, at ibigay ang kaniyang buhay na pangtubos sa marami.\" — Marcos 10:45",id:"Tuklasin kung paano ka natatanging pinagkalooban ng Diyos para maglingkod sa Kanyang simbahan dito sa Kuwait. Ginagamit ng tool na ito ang buong 133-tanong na Pagsusuri ng Espirituwal na Kaloob kasunod ng isang 7-tanong na Heart Check batay sa modelo ng paglilingkod ni Hesus.",im:"⏱  Mga 15–20 minuto",is:"Simulan ang Aking Pagtuklas",ph:["Esp. Kaloob (133 T)","Heart Check (7 T)","Aking Profile"],pt:"Pagsusuri ng Espirituwal na Kaloob",pn:"Sagutin ayon sa kung sino ka TALAGA — hindi kung sino ang gusto mong maging.",sh:["0\nHindi\nKailanman","1\nMinsan","2\nMadalas","3\nPalagi"],po:(p)=>`Pahina ${p} ng 7 · T${(p-1)*19+1}–${p*19}`,pw:"⚠️ Pakisagot ang lahat ng tanong sa pahinang ito bago magpatuloy.",nx:"Susunod na Pahina →",bk:"← Bumalik",ht:"Bahagi 2: Pagsuri ng Puso",hv:"\"Siya'y tumindig mula sa pagkain, hinubad ang kaniyang panlabas na kasuotan, at nagbigkis ng tuwalya sa kaniyang baywang…\" — Juan 13:4",hs:"Kinuha ni Hesus ang tuwalya. Gaano kahanda ang iyong puso na gawin din ito?",hc:["Hindi Kailanman","Bihira","Minsan","Madalas","Palagi"],fn:"Ipakita ang Aking Ministry Profile →",sl:"Ang Iyong Pangunahing Espirituwal na Kaloob",t3:"Ang Iyong Top 3 na Kaloob",sc:"Lahat ng 19 na Kaloob",vl:"Ang Iyong Anchor Verse",tc:"Ang Iyong Towel Challenge",ml:"Mga Mungkahing Ministeryo Para sa Iyo",el:"Isang Salita Para sa Iyo",ns:"Ang Iyong Susunod na Hakbang",nt:"Ngayon na natuklasan mo na ang iyong profile, makipag-usap sa iyong ministry leader upang malaman kung saan ka magsisimula!",ld:"Ptr. Justin Flores  ·  Ptr. Doddie Arciaga",pr:"🖨  I-print ang Aking Profile",rr:"Ulit na Gawin",st:["Espirituwal na Kaloob","Pagsuri ng Puso","Aking Profile"]}};
function App(){
  const[lang,setLang]=useState("en");
  const[phase,setPhase]=useState(0);
  const[pg,setPg]=useState(0);
  const[ans,setAns]=useState({});
  const[hAns,setHAns]=useState({});
  const[hIdx,setHIdx]=useState(0);
  const[res,setRes]=useState(null);
  const[warn,setWarn]=useState(false);
  const topRef=useRef(null);
  const t=TX[lang];
  const hqs=HQ[lang];
  const stn=phase<=1?0:phase===2?1:2;
  const pgS=pg*19;
  const pgQs=QS.slice(pgS,pgS+19);
  const pgDone=pgQs.every((_,i)=>ans[pgS+i]!==undefined);
  const totalAns=Object.keys(ans).length;
  const scroll=()=>{if(topRef.current)topRef.current.scrollIntoView({behavior:"auto"})};
  const card=(x={})=>({background:"white",border:`1px solid ${BD}`,borderRadius:12,...x});
  const nextPg=()=>{if(!pgDone){setWarn(true);scroll();return;}setWarn(false);scroll();if(pg<6)setPg(p=>p+1);else{setPhase(2);setHIdx(0);}};
  const backPg=()=>{setWarn(false);scroll();if(pg>0)setPg(p=>p-1);else setPhase(0);};
  const nextH=()=>{if(hAns[hqs[hIdx].id]===undefined)return;if(hIdx<hqs.length-1)setHIdx(i=>i+1);else buildResult();};
  const backH=()=>{if(hIdx>0)setHIdx(i=>i-1);else{setPhase(1);setPg(6);}};
  const buildResult=()=>{
    const scores=calcScores(ans);
    const t3=getTop3(scores);
    const pk=t3[0].k;
    const prf=PRF[pk][lang];
    const hTotal=Object.values(hAns).reduce((a,b)=>a+b,0);
    const tier=hTotal<=17?"low":hTotal<=24?"mid":"high";
    const towel=prf.tc+" "+TC[tier][lang];
    setRes({scores,t3,prf,towel,pk});
    setPhase(3);
  };
  const reset=()=>{setPhase(0);setPg(0);setAns({});setHAns({});setHIdx(0);setRes(null);setWarn(false);scroll();};
  return(
    <div ref={topRef} style={{maxWidth:560,margin:"0 auto"}}>
      <div style={{background:A,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,.18)"}}>
        <div>
          <div style={{fontSize:9,color:"rgba(255,255,255,.55)",letterSpacing:".12em",textTransform:"uppercase",fontWeight:700}}>{t.ch}</div>
          <div style={{fontSize:13,color:"white",fontWeight:700,marginTop:1}}>Spiritual Gifts & Servant Leadership</div>
        </div>
        <button onClick={()=>setLang(l=>l==="en"?"tl":"en")} className="no-print" style={{background:"rgba(255,255,255,.18)",border:"1px solid rgba(255,255,255,.3)",color:"white",borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,flexShrink:0}}>🌐 {t.lb}</button>
      </div>
      {phase>0&&phase<3&&(
        <div style={{background:"white",padding:"10px 16px",borderBottom:`1px solid ${BD}`,display:"flex",alignItems:"center"}}>
          {t.st.map((s,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",flex:i<2?1:"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                <div style={{width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,background:i<stn?TL:i===stn?A:"#E5E7EB",color:i<=stn?"white":GR}}>{i<stn?"✓":i+1}</div>
                <span style={{fontSize:10,fontWeight:600,color:i===stn?A:i<stn?TL:GR,whiteSpace:"nowrap"}}>{s}</span>
              </div>
              {i<2&&<div style={{flex:1,height:2,margin:"0 5px",background:i<stn?TL:"#E5E7EB",borderRadius:1}}/>}
            </div>
          ))}
        </div>
      )}
      <div style={{padding:"16px 16px 0"}}>
        {phase===0&&(
          <div className="fade">
            <div style={{textAlign:"center",marginBottom:14}}>
              <div style={{fontSize:56,marginBottom:10}}>🫙</div>
              <h1 style={{fontSize:20,fontWeight:800,color:"#1F2937",lineHeight:1.3,whiteSpace:"pre-line",marginBottom:12}}>{t.it}</h1>
              <div style={{background:AG,border:`1px solid ${AL}`,borderLeft:`4px solid ${A}`,borderRadius:8,padding:"10px 14px",textAlign:"left",marginBottom:12}}>
                <p style={{fontSize:13,color:A,fontStyle:"italic",lineHeight:1.65,margin:0}}>{t.iv}</p>
              </div>
              <p style={{fontSize:14,color:"#374151",lineHeight:1.7,textAlign:"left",marginBottom:12}}>{t.id}</p>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:10}}>
                {t.ph.map((p,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:5,background:GRG,border:`1px solid ${BD}`,borderRadius:20,padding:"5px 12px",fontSize:11,color:GR}}>
                    <span style={{width:16,height:16,borderRadius:"50%",background:A,color:"white",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700}}>{i+1}</span>{p}
                  </div>
                ))}
              </div>
              <div style={{fontSize:12,color:GR,marginBottom:12}}>{t.im}</div>
            </div>
            <div style={{background:GRG,border:`1px solid ${BD}`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:GR,lineHeight:1.6}}>{t.prv}</div>
            <button onClick={()=>{setPhase(1);setPg(0);scroll();}} style={{width:"100%",padding:"15px",background:A,color:"white",border:"none",borderRadius:12,fontSize:16,fontWeight:700,marginBottom:20}}>{t.is}</button>
          </div>
        )}
        {phase===1&&(
          <div className="fade">
            <div style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}}>
                <h2 style={{fontSize:14,fontWeight:700,color:"#1F2937",margin:0,flex:1}}>{t.pt}</h2>
                <span style={{fontSize:10,color:A,fontWeight:700,background:AL,borderRadius:8,padding:"2px 8px",flexShrink:0,marginLeft:8}}>{t.po(pg+1)}</span>
              </div>
              <p style={{fontSize:12,color:GR,fontStyle:"italic",marginBottom:8}}>{t.pn}</p>
              <div style={{display:"flex",gap:3,marginBottom:3}}>{[0,1,2,3,4,5,6].map(i=><div key={i} style={{flex:1,height:6,borderRadius:3,background:i<pg?TL:i===pg?A:"#E5E7EB"}}/>)}</div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:GR}}>
                <span>{lang==="en"?"Page":"Pahina"} {pg+1}/7</span>
                <span>{totalAns}/133 {lang==="en"?"answered":"nasagot"}</span>
              </div>
            </div>
            <div style={{display:"flex",gap:1,marginBottom:12,borderRadius:8,overflow:"hidden",border:`1px solid ${BD}`}}>
              {[0,1,2,3].map(v=>(
                <div key={v} style={{flex:1,textAlign:"center",padding:"6px 2px",background:["#F9FAFB","#FEF3C7","#FEF08A","#FFFBEB"][v]}}>
                  <div style={{fontSize:15,fontWeight:800,color:A}}>{v}</div>
                  <div style={{fontSize:8,color:GR,lineHeight:1.3,whiteSpace:"pre-line"}}>{t.sh[v]}</div>
                </div>
              ))}
            </div>
            {warn&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:12,color:"#DC2626",fontWeight:600}}>{t.pw}</div>}
            {pgQs.map((_,qi)=>{
              const idx=pgS+qi,sel=ans[idx];
              return(
                <div key={idx} style={{...card(),padding:"11px 12px",marginBottom:7,borderColor:sel!==undefined?"rgba(180,83,9,.2)":BD}}>
                  <div style={{display:"flex",gap:7,alignItems:"flex-start",marginBottom:8}}>
                    <span style={{fontSize:9,fontWeight:700,color:"white",background:sel!==undefined?A:GR,borderRadius:5,padding:"2px 5px",flexShrink:0,marginTop:2,lineHeight:1.3}}>Q{idx+1}</span>
                    <p style={{fontSize:14,lineHeight:1.65,margin:0,color:"#1F2937",flex:1}}>{QS[idx]}</p>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {[0,1,2,3].map(v=>(
                      <button key={v} onClick={()=>{setAns(p=>({...p,[idx]:v}));setWarn(false);}}
                        style={{flex:1,padding:"9px 4px",fontSize:16,fontWeight:800,background:sel===v?A:"white",border:`2px solid ${sel===v?A:BD}`,borderRadius:8,color:sel===v?"white":A,transition:"all .1s"}}>{v}</button>
                    ))}
                  </div>
                </div>
              );
            })}
            <div style={{display:"flex",gap:10,padding:"12px 0 20px"}} className="no-print">
              <button onClick={backPg} style={{padding:"13px 14px",background:"white",border:`1px solid ${BD}`,borderRadius:10,fontSize:14,color:GR,fontWeight:500}}>{t.bk}</button>
              <button onClick={nextPg} style={{flex:1,padding:"13px",fontSize:15,fontWeight:700,background:A,color:"white",border:"none",borderRadius:10}}>{pg<6?t.nx:(lang==="en"?"Go to Heart Check →":"Pumunta sa Heart Check →")}</button>
            </div>
          </div>
        )}
        {phase===2&&(
          <div className="fade">
            <div style={{marginBottom:14}}>
              <h2 style={{fontSize:15,fontWeight:700,color:"#1F2937",margin:"0 0 6px"}}>{t.ht}</h2>
              <div style={{background:AG,border:`1px solid ${AL}`,borderLeft:`4px solid ${A}`,borderRadius:6,padding:"8px 12px",marginBottom:8}}>
                <p style={{fontSize:12,color:A,fontStyle:"italic",lineHeight:1.55,margin:0}}>{t.hv}</p>
              </div>
              <p style={{fontSize:13,color:GR}}>{t.hs}</p>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
              <div style={{flex:1,height:7,background:"#E5E7EB",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:4,background:A,width:`${((hIdx+1)/hqs.length)*100}%`,transition:"width .3s"}}/>
              </div>
              <span style={{fontSize:12,color:GR,fontWeight:600,flexShrink:0}}>{hIdx+1}/{hqs.length}</span>
            </div>
            <div style={{fontSize:10,color:TL,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",marginBottom:8}}>{lang==="en"?"Principle":"Prinsipyo"}: {hqs[hIdx].pr}</div>
            <div style={{...card(),padding:"20px",marginBottom:16,minHeight:88}}>
              <p style={{fontSize:17,lineHeight:1.7,margin:0,color:"#1F2937"}}>{hqs[hIdx].txt}</p>
            </div>
            <div style={{display:"flex",gap:5,marginBottom:20}}>
              {t.hc.map((lbl,i)=>{
                const v=i+1,sel=hAns[hqs[hIdx].id]===v;
                return(
                  <button key={i} onClick={()=>setHAns(p=>({...p,[hqs[hIdx].id]:v}))}
                    style={{flex:1,padding:"9px 2px 7px",fontSize:9,lineHeight:1.3,background:sel?A:"white",border:`2px solid ${sel?A:BD}`,borderRadius:10,color:sel?"white":GR,fontWeight:sel?700:400,textAlign:"center",transition:"all .12s"}}>
                    <div style={{fontSize:19,fontWeight:800,marginBottom:3,color:sel?"white":A}}>{v}</div>{lbl}
                  </button>
                );
              })}
            </div>
            <div style={{display:"flex",gap:10,paddingBottom:20}} className="no-print">
              <button onClick={backH} style={{padding:"13px 14px",background:"white",border:`1px solid ${BD}`,borderRadius:10,fontSize:14,color:GR}}>{t.bk}</button>
              <button onClick={nextH} disabled={hAns[hqs[hIdx].id]===undefined}
                style={{flex:1,padding:"13px",fontSize:15,fontWeight:700,border:"none",borderRadius:10,background:hAns[hqs[hIdx].id]!==undefined?A:"#E5E7EB",color:hAns[hqs[hIdx].id]!==undefined?"white":GR,cursor:hAns[hqs[hIdx].id]!==undefined?"pointer":"not-allowed"}}>
                {hIdx===hqs.length-1?t.fn:`${lang==="en"?"Next":"Susunod"} →`}
              </button>
            </div>
          </div>
        )}
        {phase===3&&res&&(()=>{
          const{scores,t3,prf,towel}=res;
          return(
            <div className="fade">
              <div style={{background:AG,border:`1px solid ${AL}`,borderRadius:16,padding:"22px 16px",textAlign:"center",marginBottom:12}}>
                <div style={{fontSize:50,marginBottom:8}}>{GE[res.pk]}</div>
                <div style={{fontSize:9,color:GR,fontWeight:700,letterSpacing:".12em",textTransform:"uppercase",marginBottom:4}}>{t.sl}</div>
                <h2 style={{fontSize:24,fontWeight:800,color:A,margin:"0 0 10px",lineHeight:1.2}}>{prf.s}</h2>
                <p style={{fontSize:14,color:"#374151",lineHeight:1.7,margin:0}}>{prf.d}</p>
              </div>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:10,color:GR,fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}}>{t.t3}</div>
                <div style={{display:"flex",gap:8}}>
                  {t3.map((g,i)=>(
                    <div key={i} style={{flex:1,...card(),padding:"10px 6px",textAlign:"center",border:`2px solid ${i===0?A:BD}`}}>
                      <div style={{fontSize:24,marginBottom:4}}>{g.emoji}</div>
                      <div style={{fontSize:9,fontWeight:700,color:i===0?A:GR,lineHeight:1.3}}>{g.name}</div>
                      <div style={{background:i===0?A:GRG,color:i===0?"white":GR,borderRadius:10,padding:"2px 6px",fontSize:11,fontWeight:700,marginTop:4,display:"inline-block"}}>{g.v}/21</div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{...card(),padding:"12px 14px",marginBottom:12}}>
                <div style={{fontSize:10,color:GR,fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>{t.sc}</div>
                {GK.map(k=>{
                  const sc=scores[k]||0,isTop=t3.some(g=>g.k===k);
                  return(
                    <div key={k} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                      <div style={{width:22,display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                        <span style={{fontSize:8,fontWeight:700,color:isTop?A:GR}}>{k}</span>
                        {isTop&&<span style={{fontSize:7}}>{GE[k]}</span>}
                      </div>
                      <div style={{flex:1,height:9,background:"#F3F4F6",borderRadius:4,overflow:"hidden"}}>
                        <div style={{height:"100%",borderRadius:4,background:isTop?A:"#D1D5DB",width:`${(sc/21)*100}%`}}/>
                      </div>
                      <span style={{fontSize:9,color:isTop?A:GR,fontWeight:isTop?700:400,width:28,textAlign:"right",flexShrink:0}}>{sc}/21</span>
                    </div>
                  );
                })}
              </div>
              <div style={{background:"white",border:`1px solid ${BD}`,borderLeft:`4px solid ${A}`,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                <div style={{fontSize:9,color:GR,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>{t.vl}</div>
                <p style={{fontSize:14,fontStyle:"italic",color:A,margin:0,lineHeight:1.7}}>{prf.v}</p>
              </div>
              <div style={{background:TLG,border:`1px solid rgba(15,118,110,.15)`,borderLeft:`4px solid ${TL}`,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                <div style={{fontSize:9,color:TL,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>🧺 {t.tc}</div>
                <p style={{fontSize:14,color:"#134E4A",margin:0,lineHeight:1.7}}>{towel}</p>
              </div>
              <div style={{marginBottom:10}}>
                <div style={{fontSize:10,color:GR,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>{t.ml}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {prf.mini.map((m,i)=><span key={i} style={{background:"white",border:`2px solid ${A}`,borderRadius:20,padding:"7px 16px",fontSize:13,color:A,fontWeight:700}}>{m}</span>)}
                </div>
              </div>
              <div style={{...card(),padding:"14px",marginBottom:12}}>
                <div style={{fontSize:9,color:GR,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>{t.el}</div>
                <p style={{fontSize:16,color:"#1F2937",margin:0,lineHeight:1.65,fontWeight:600,fontStyle:"italic"}}>"{prf.enc}"</p>
              </div>
              <div style={{background:A,borderRadius:14,padding:"18px 16px",marginBottom:14}}>
                <div style={{fontSize:9,color:"rgba(255,255,255,.55)",fontWeight:700,letterSpacing:".12em",textTransform:"uppercase",marginBottom:5}}>🚀 {t.ns}</div>
                <p style={{fontSize:14,color:"white",lineHeight:1.65,margin:"0 0 10px"}}>{t.nt}</p>
                <div style={{fontSize:15,color:"white",fontWeight:700,borderTop:"1px solid rgba(255,255,255,.25)",paddingTop:10}}>{t.ld}</div>
              </div>
              <div style={{display:"flex",gap:10,paddingBottom:24}} className="no-print">
                <button onClick={()=>window.print()} style={{flex:1,padding:"13px",background:"white",border:`1px solid ${BD}`,borderRadius:10,fontSize:14,color:GR,fontWeight:600}}>{t.pr}</button>
                <button onClick={reset} style={{padding:"13px 14px",background:"white",border:`1px solid ${BD}`,borderRadius:10,fontSize:14,color:GR}}>{t.rr}</button>
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
