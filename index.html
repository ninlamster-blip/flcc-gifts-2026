"Madalas akong nakakakita ng tiyak na mga resulta bilang direktang tugon sa aking mga panalangin.",
"May tiwala akong ibinabahagi ang aking kaalaman at mga pananaw sa iba.",
"Nalalaman ko kung saan tayo kailangang pumunta at tinutulungan ang iba na makarating doon.",
"Nasisiyahan akong gumawa ng mga praktikal na bagay para sa iba na nangangailangan.",
"Nakakaramdam ako ng pagkakailangan na ilantad ang kasalanan saan man ito makita at hamunin ang mga tao sa pagsisisi.",
"Nasisiyahan akong mapagtiyagang ngunit matibay na paunlarin ang iba sa kanilang pag-unlad bilang mga mananampalataya.",
"Nasisiyahan akong ipaliwanag ang mga bagay sa mga tao upang sila ay lumago nang espirituwal at personal.",
"Mayroon akong mga pananaw sa kung paano solusyunin ang mga problemang hindi nakikita ng iba."
];

/* ── PROFILES (all 19 gifts × EN + TL) ── */
const PRF={
A:{en:{s:"The Faithful Steward",d:"God has gifted you with the rare ability to bring order, clarity, and excellence to everything you touch. Like Nehemiah who organized an entire city's rebuilding with strategy and prayer, you help turn God's vision into practical reality. Behind every thriving ministry is someone like you — faithful, organized, and deeply committed to doing things well for God's glory.",v:"\"For God is not a God of disorder but of peace.\" — 1 Corinthians 14:40",tc:"Practice serving without directing. Find one task where someone else leads and support them fully — without suggesting how they could do it better. Let God use you as a foundation, not a foreman.",mini:["Admin/Logistics","Fellowship","Worship Team"],enc:"The church moves forward because of people like you who show up, plan well, and quietly hold everything together — keep going, kapatid."},
tl:{s:"Ang Tapat na Katiwala",d:"Pinagkalooban ka ng Diyos ng bihirang kakayahang magdala ng kaayusan, linaw, at kahusayan sa lahat ng iyong ginagawa. Tulad ni Nehemias na nag-organisa ng muling pagtatayo ng buong lungsod sa pamamagitan ng estratehiya at panalangin, tinutulungan mo ang bisyon ng Diyos na maging katotohanang-praktikal. Sa likod ng bawat maunlad na ministeryo ay may isang katulad mo — tapat, organisado, at lubos na nakatuon.",v:"\"Sapagka't ang Dios ay hindi Dios ng kaguluhan, kundi ng kapayapaan.\" — 1 Corinto 14:40",tc:"Magsanay ng paglilingkod nang hindi nangunguna. Hanapin ang isang gawaing pinamumunuan ng iba at suportahan sila nang buong-buo — nang hindi nagmumungkahi kung paano nila ito mas magagawa.",mini:["Admin/Logistics","Fellowship","Worship Team"],enc:"Sumusulong ang simbahan dahil sa mga katulad mo na nagpapakita, nagpaplano nang maayos, at tahimik na nagtataglay ng lahat — magpatuloy, kapatid."}},
B:{en:{s:"The Kingdom Pioneer",d:"God has placed a pioneering spirit within you — a holy restlessness for people and communities not yet reached by the Gospel. Like Paul who crossed seas and cultures to plant churches, you carry a burden for the unreached. As a Filipino OFW in Kuwait, you are already living the apostolic calling — you ARE the missionary.",v:"\"How beautiful are the feet of those who bring good news!\" — Romans 10:15",tc:"The greatest challenge for pioneers is staying long enough to let roots grow. Choose one person in FLCC to invest in consistently — not just broadly reaching, but deeply walking with one soul.",mini:["Outreach/Evangelism","Fellowship","Youth & Children"],enc:"You didn't end up in Kuwait by accident — God sent you here as His ambassador, and the harvest around you is greater than you know."},
tl:{s:"Ang Pioneer ng Kaharian",d:"Naglagay ang Diyos ng espiritu ng pioneer sa iyo — isang banal na pagkabalisa para sa mga tao at komunidad na hindi pa naaabot ng Ebanghelyo. Tulad ni Pablo na tumawid ng mga dagat at kultura upang magtanim ng mga simbahan, nagdadala ka ng pasan para sa mga hindi pa naaabot. Bilang Filipino OFW sa Kuwait, nabubuhay ka na sa apostolikong tawag — ikaw ANG misyonero.",v:"\"Pagkaganda ng mga paa ng mga nagdadala ng masasayang balita!\" — Roma 10:15",tc:"Ang pinakamahirap na hamon para sa mga pioneer ay ang manatili nang matagal upang lumago ang mga ugat. Pumili ng isang tao sa FLCC na pag-uukunan mo nang tuluy-tuloy.",mini:["Outreach/Evangelism","Fellowship","Youth & Children"],enc:"Hindi ka nakarating sa Kuwait nang aksidente — ipinadala ka ng Diyos dito bilang Kanyang kinatawan, at ang ani sa paligid mo ay mas malaki kaysa sa alam mo."}},
C:{en:{s:"The Builder for God",d:"Your hands are an act of worship. Like Bezalel in Exodus whom God filled with skill and ability to build the tabernacle, you are called to create things that serve God's purposes. Every structure you build for the kingdom carries eternal weight — don't underestimate the holiness of your hands.",v:"\"I have filled him with the Spirit of God, with wisdom, with understanding, with knowledge and with all kinds of skills.\" — Exodus 31:3",tc:"Those with craftsmanship gifts often serve quietly and feel overlooked. Identify one practical need in the church and offer your skills freely, with no expectation of recognition.",mini:["Admin/Logistics","Media/Tech","Hospitality/Ushering"],enc:"The church needs builders, fixers, and makers — God has specifically equipped your hands to serve His house. Offer what you have, and watch Him multiply it."},
tl:{s:"Ang Tagagawa para sa Diyos",d:"Ang iyong mga kamay ay isang gawa ng pagsamba. Tulad ni Bezaleel sa Exodo na pinuno ng Diyos ng kasanayan at kakayahan upang itayo ang tabernakulo, ikaw ay tinawag upang lumikha ng mga bagay na nagsisilbi sa mga layunin ng Diyos. Bawat estruktura na iyong itinatayo para sa kaharian ay may walang hanggang bigat.",v:"\"Pinuno ko siya ng Espiritu ng Diyos, ng karunungan, ng pag-unawa, ng kaalaman at ng lahat ng uri ng kasanayan.\" — Exodo 31:3",tc:"Ang mga may kaloob ng craftsmanship ay naglilingkod nang tahimik at nakakaramdam na hindi pinapansin. Tukuyin ang isang praktikal na pangangailangan sa simbahan at alok ang iyong mga kasanayan nang malaya.",mini:["Admin/Logistics","Media/Tech","Hospitality/Ushering"],enc:"Kailangan ng simbahan ang mga nagtatayo, nagkukumpuni, at gumagawa — ginawa ng Diyos ang iyong mga kamay para paglingkuran ang Kanyang tahanan."}},
D:{en:{s:"The Creative Voice",d:"God speaks through your creativity. Like David who worshiped through music and poetry, your artistic gifts open hearts to truths that words alone cannot reach. In a world drowning in noise, your creative voice can cut through and point people to Jesus in ways that logic never could.",v:"\"Praise him with the sounding of the trumpet, praise him with the harp and lyre, praise him with dancing.\" — Psalm 150:3-4",tc:"Creative people can sometimes serve their art more than their community. Use your creative gift specifically for one other person this week — create something entirely for their encouragement.",mini:["Worship Team","Media/Tech","Youth & Children"],enc:"The world is full of noise — your God-given creativity is the kind of signal that cuts through it all. Don't hold back what God has given you."},
tl:{s:"Ang Malikhain",d:"Nagsasalita ang Diyos sa pamamagitan ng iyong pagkamalikhain. Tulad ni David na sumamba sa pamamagitan ng musika at tula, ang iyong mga artistikong kaloob ay nagbubukas ng mga puso sa mga katotohanang hindi maipahayag ng mga salita lamang.",v:"\"Purihin siya sa tunog ng trumpeta, purihin siya ng alpa at lira, purihin siya ng sayaw.\" — Awit 150:3-4",tc:"Minsan ang mga malikhain ay naglilingkod sa kanilang sining nang higit sa kanilang komunidad. Gamitin ang iyong malikhain na kaloob para sa isang ibang tao ngayong linggo.",mini:["Worship Team","Media/Tech","Youth & Children"],enc:"Puno ng ingay ang mundo — ang iyong Diyos-ibinigay na pagkamalikhain ang uri ng senyales na tumutawid sa lahat nito. Huwag pigilan ang ibinigay sa iyo ng Diyos."}},
E:{en:{s:"The Watchman",d:"God has given you spiritual eyes that see what others cannot. Like the Bereans who tested everything against scripture, you have a God-given ability to sense when something is spiritually right or wrong. This is not a gift for pride — it is a protective gift given for the safety of the whole church.",v:"\"Dear friends, do not believe every spirit, but test the spirits to see whether they are from God.\" — 1 John 4:1",tc:"Discernment without love can become judgmental. Every time you sense something is wrong, pause and pray for that person first before speaking. Let love lead your truth.",mini:["Prayer Ministry","Worship Team","Fellowship"],enc:"The church needs watchmen who love deeply enough to guard carefully — your eyes and your prayers are a covering over this congregation."},
tl:{s:"Ang Bantay",d:"Binigyan ka ng Diyos ng espirituwal na mga mata na nakakakita ng hindi makita ng iba. Tulad ng mga Bereo na sinubok ang lahat laban sa kasulatan, mayroon kang kaloob na maramdaman kung ang isang bagay ay espirituwal na tama o mali.",v:"\"Mga kaibigan, huwag maniwala sa bawat espiritu, kundi subukin ang mga espiritu kung sila'y mula sa Diyos.\" — 1 Juan 4:1",tc:"Ang Discernment nang walang pagmamahal ay maaaring maging mapaghatol. Sa tuwing mararamdaman mo ang mali sa isang tao, ihinto at ipanalangin sila muna bago ka magsalita.",mini:["Prayer Ministry","Worship Team","Fellowship"],enc:"Kailangan ng simbahan ang mga bantay na nagmamahal nang sapat upang mag-ingat nang maingat — ang iyong mga mata at iyong mga panalangin ay isang takip sa kongregasyong ito."}},
F:{en:{s:"The Encourager",d:"Like Barnabas — whose very name means Son of Encouragement — you have an extraordinary ability to see the best in people and call it out of them. In a community of OFWs who carry loneliness and sacrifice daily, your gift is not just helpful — it is essential. You carry the ministry of the Holy Spirit's comfort in your words and presence.",v:"\"Therefore encourage one another and build each other up, just as in fact you are doing.\" — 1 Thessalonians 5:11",tc:"Encouragers can avoid difficult conversations to keep peace. Ask God for the courage to speak one honest, loving truth to someone who needs it — not just the comfortable word, but the right word.",mini:["Fellowship","Youth & Children","Outreach/Evangelism"],enc:"Never underestimate the power of your presence — you carry the atmosphere of heaven into every room you walk into, and people are different because of you."},
tl:{s:"Ang Tagahikayat",d:"Tulad ni Barnabas — na ang mismong pangalan ay nangangahulugang Anak ng Pagpapalakas ng Loob — mayroon kang pambihirang kakayahang makita ang pinakamahusay sa mga tao at tawagan ito mula sa kanila. Sa isang komunidad ng mga OFW na nagdadala ng kalungkutan at sakripisyo araw-araw, ang iyong kaloob ay hindi lamang nakatutulong — ito ay mahalaga.",v:"\"Kaya't palakasin ninyo ang isa't isa at itayo ang bawat isa, tulad ng inyong ginagawa.\" — 1 Tesalonica 5:11",tc:"Ang mga Tagahikayat ay maaaring umiiwas sa mahihirap na pag-uusap. Hilingin sa Diyos ang lakas ng loob na sabihin ang isang tapat, mapagmahal na katotohanan sa isang taong nangangailangan nito.",mini:["Fellowship","Youth & Children","Outreach/Evangelism"],enc:"Huwag kailanman maliitin ang kapangyarihan ng iyong presensya — dala mo ang kapaligiran ng langit sa bawat silid na pinapasok mo, at ang mga tao ay nagbabago dahil sa iyo."}},
G:{en:{s:"The Evangelist",d:"Like Philip who ran alongside the Ethiopian official without hesitation, you carry a God-given fire to share the Good News. You have a natural ability to make the Gospel clear, relevant, and personal. As a Filipino OFW in Kuwait, you are already placed in one of the most strategic mission fields on earth — your workplace is your pulpit.",v:"\"You will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the ends of the earth.\" — Acts 1:8",tc:"Evangelists can focus so much on reaching new people that they neglect to disciple those already reached. Follow up on one person you've already shared the Gospel with — water the seed you've already planted.",mini:["Outreach/Evangelism","Fellowship","Youth & Children"],enc:"You are God's ambassador in Kuwait — every conversation is a divine appointment, and every relationship is a door He has opened for you."},
tl:{s:"Ang Ebanghelista",d:"Tulad ni Felipe na tumakbo kasabay ng karwahe ng opisyal na Etiopiko nang walang pag-aalangan, nagdadala ka ng apoy mula sa Diyos upang ibahagi ang Magandang Balita. Mayroon kang natural na kakayahang gawing malinaw, may kaugnayan, at personal ang Ebanghelyo.",v:"\"Kayo'y magiging mga saksi ko sa Jerusalem, at sa buong Judea at Samaria, at hanggang sa dulo ng lupa.\" — Gawa 1:8",tc:"Ang mga Ebanghelista ay maaaring nakatutok nang husto sa pag-abot sa mga bagong tao na napapabayaan ang pagdidisipulo. Makipag-ugnayan sa isang taong ibinahagian mo na ng Ebanghelyo.",mini:["Outreach/Evangelism","Fellowship","Youth & Children"],enc:"Ikaw ang kinatawan ng Diyos sa Kuwait — bawat pag-uusap ay isang banal na tipanan, at bawat relasyon ay isang pintuan na Kanyang binuksan para sa iyo."}},
H:{en:{s:"The Intercessor of Faith",d:"Your faith moves mountains. Like Elijah who called down rain after three years of drought, you believe God for the impossible — and He consistently honors that trust. Your faith is not just a feeling; it is a foundation that the entire congregation stands on.",v:"\"Now faith is confidence in what we hope for and assurance about what we do not see.\" — Hebrews 11:1",tc:"Those with great faith can run ahead of the community, making declarations others aren't ready for. Practice faith that invites others along — share what you're believing God for so others can trust Him together with you.",mini:["Prayer Ministry","Worship Team","Outreach/Evangelism"],enc:"Your faith is a covering over this congregation — keep praying, keep believing, because God is moving in response to your trust in Him."},
tl:{s:"Ang May Pananampalatayang Mananalangin",d:"Ang iyong pananampalataya ay gumagalaw ng mga bundok. Tulad ni Elias na tumawag ng ulan pagkatapos ng tatlong taon ng tagtuyot, naniniwala ka sa Diyos para sa imposible — at patuloy na kinikilala ng Diyos ang pagtitiwalang iyon.",v:"\"Ngayon ang pananampalataya ay katiyakan sa mga bagay na inaasahan, katibayan ng mga bagay na hindi nakikita.\" — Hebreo 11:1",tc:"Ang mga may dakilang pananampalataya ay maaaring mauna sa komunidad. Magsanay ng pananampalatayang nag-iimbita sa iba — ibahagi ang iyong pinananalig sa Diyos.",mini:["Prayer Ministry","Worship Team","Outreach/Evangelism"],enc:"Ang iyong pananampalataya ay isang takip sa kongregasyong ito — magpatuloy sa pagdaralangin, magpatuloy sa paniniwala, sapagkat gumagalaw ang Diyos."}},
I:{en:{s:"The Generous Giver",d:"Like the widow who gave her two small coins, you understand at a deep level that generosity is an act of faith, not abundance. God has wired you to hold loosely the things of this world and give freely for His kingdom. Your faithfulness with money is a form of worship that moves heaven.",v:"\"God loves a cheerful giver.\" — 2 Corinthians 9:7",tc:"The gift of Giving can sometimes maintain control or the feeling of being needed. Give something of value anonymously this week — where only God will know it was you.",mini:["Admin/Logistics","Fellowship","Outreach/Evangelism"],enc:"Every peso you give in faith is an investment in eternity — God sees every sacrifice, especially the ones no one else notices."},
tl:{s:"Ang Mapagbigay",d:"Tulad ng biyudang nagbigay ng kanyang dalawang maliit na barya, nauunawaan mo sa malalim na antas na ang pagiging mapagbigay ay isang gawa ng pananampalataya, hindi ng kasaganaan. Ginawa ka ng Diyos upang hawakan nang maluwag ang mga bagay ng mundong ito.",v:"\"Umiibig ang Diyos sa nagbibigay na masaya.\" — 2 Corinto 9:7",tc:"Ang kaloob ng Pagbibigay ay maaaring gamitin upang mapanatili ang kontrol. Magbigay ng isang bagay nang hindi kilala ang nagbibigay ngayong linggo — kung saan ang Diyos lamang ang makakaalam.",mini:["Admin/Logistics","Fellowship","Outreach/Evangelism"],enc:"Bawat pisong ibinibigay mo sa pananampalataya ay isang pamumuhunan sa walang hanggan — nakikita ng Diyos ang bawat sakripisyo, lalo na ang mga hindi napapansin ng iba."}},
J:{en:{s:"The Faithful Helper",d:"Like Epaphras who labored quietly behind the scenes so that Paul could preach and plant churches, you have genuine joy in making others succeed. You are not interested in the spotlight — you are interested in the work getting done. This is the very foundation Jesus described: the greatest in the kingdom is the servant of all.",v:"\"Whoever wants to become great among you must be your servant, just as the Son of Man did not come to be served, but to serve.\" — Matthew 20:26,28",tc:"Those with the Helps gift can do so much that they enable dependency rather than growth. Instead of doing a task for someone, teach or walk alongside them so they can do it themselves next time.",mini:["Admin/Logistics","Hospitality/Ushering","Fellowship"],enc:"The church stands because of people like you who show up without applause, do the work without recognition, and serve without stopping — you are seen by God and deeply valued here."},
tl:{s:"Ang Tapat na Katulong",d:"Tulad ni Epaphras na nagpakabusabos nang tahimik sa likod ng eksena upang maaaring mangaral si Pablo, mayroon kang tunay na kagalakan sa paggawa ng tagumpay ng iba. Hindi ka interesado sa spotlight — interesado ka sa pagkakumpleto ng trabaho.",v:"\"Ang sinomang nagnanais na maging dakila sa inyo ay magiging inyong lingkod, tulad ng Anak ng Tao na hindi naparito upang paglingkuran, kundi upang maglingkod.\" — Mateo 20:26,28",tc:"Ang mga may kaloob ng Pagttulong ay maaaring gumagawa ng napakaraming bagay na nagbibigay ng pagkakataon sa pag-asa. Sa halip na gumawa para sa isang tao, turuan sila upang magawa nila ito mismo.",mini:["Admin/Logistics","Hospitality/Ushering","Fellowship"],enc:"Nakatayo ang simbahan dahil sa mga katulad mo na nagpapakita nang walang palakpakan, gumagawa nang walang pagkilala, at naglilingkod nang walang tigil — nakikita ka ng Diyos dito."}},
K:{en:{s:"The Welcome Host",d:"Like Lydia who immediately opened her home to Paul's entire team, you create environments where people instantly feel they belong. For OFWs far from home and family, your gift of hospitality is not just warmth — it is healing. You bring the Father's welcome into every space you enter.",v:"\"Offer hospitality to one another without grumbling. Each of you should use whatever gift you have received to serve others.\" — 1 Peter 4:9-10",tc:"Hospitality can become people-pleasing — creating comfort at the expense of truth. Welcome someone who is difficult to welcome this week — someone on the edges of the community.",mini:["Hospitality/Ushering","Fellowship","Youth & Children"],enc:"Every person who walks through our church doors and feels welcomed — that is your gift working, and it has eternal impact far beyond what you see."},
tl:{s:"Ang Matanggap na Host",d:"Tulad ni Lydia na agad na nagbukas ng kanyang tahanan sa buong koponan ni Pablo, lumilikha ka ng mga kapaligiran kung saan ang mga tao ay agad na nakakaramdam na sila ay kabilang. Para sa mga OFW na malayo sa tahanan at pamilya, ang iyong kaloob ng pagiging mapagpatanggap ay pagpapagaling.",v:"\"Mag-alok ng pagiging mapagpatanggap sa isa't isa nang walang pagbubulong-bulungan. Ang bawat isa sa inyo ay dapat gumamit ng anumang kaloob na natanggap niya upang paglingkuran ang iba.\" — 1 Pedro 4:9-10",tc:"Ang Hospitality ay maaaring maging pagiging mapagpagaan ng loob ng tao. Tanggapin ang isang taong mahirap tanggapin ngayong linggo — isang tao sa gilid ng komunidad.",mini:["Hospitality/Ushering","Fellowship","Youth & Children"],enc:"Bawat taong lumapit sa mga pinto ng aming simbahan at nakakaramdam ng pagtanggap — iyon ang iyong kaloob na gumagana, at ito ay may walang hanggang epekto."}},
L:{en:{s:"The Prayer Warrior",d:"Like Anna who prayed and fasted in the temple for decades, or the early church that prayed through the night for Peter's miraculous release — intercession is your sacred post. You feel the weight of what others carry. Your prayers are not a last resort; they are the first line of defense for this congregation.",v:"\"The prayer of a righteous person is powerful and effective.\" — James 5:16",tc:"Intercessors can substitute prayer for action. After you pray for someone, take one small practical step to also serve them — let your prayers have hands and feet.",mini:["Prayer Ministry","Worship Team","Outreach/Evangelism"],enc:"Things are happening in the spirit because you are praying — don't stop, don't grow weary, and never underestimate what God is doing through your faithful intercession."},
tl:{s:"Ang Mandirigmang Nananalangin",d:"Tulad ni Ana na nanalangin at nag-ayuno sa templo sa loob ng mga dekada, o ng maagang simbahan na nanalangin sa buong gabi para sa paglabas ni Pedro mula sa bilangguan — ang panalangin ay ang iyong sagradong post. Nararamdaman mo ang bigat ng dala ng iba.",v:"\"Ang taimtim na panalangin ng matuwid ay lubhang makapangyarihan.\" — Santiago 5:16",tc:"Ang mga Intercessors ay maaaring pumalit ng panalangin sa kilos. Pagkatapos mong ipanalangin ang isang tao, gumawa ng isang maliit na praktikal na hakbang upang paglingkuran din sila.",mini:["Prayer Ministry","Worship Team","Outreach/Evangelism"],enc:"Nagaganap ang mga bagay sa espiritu dahil nanalangin ka — huwag huminto, huwag mapagod, at huwag kailanman maliitin ang ginagawa ng Diyos sa pamamagitan ng iyong tapat na panalangin."}},
M:{en:{s:"The Knowledge Bearer",d:"God deposits truth in you that others desperately need. Like the disciples who marveled at how Jesus handled the Word, you have a Spirit-given capacity to receive and communicate divine knowledge. Your insights carry spiritual weight and life-changing power.",v:"\"The secret things belong to the Lord our God, but the things revealed belong to us and to our children forever.\" — Deuteronomy 29:29",tc:"Knowledge without love can become intellectual pride. Share one insight you've received specifically to serve someone — not to impress them, but to genuinely meet a need they have.",mini:["Admin/Logistics","Fellowship","Youth & Children"],enc:"What God has deposited in you is not just for you — it is treasure for the whole church, and there are people here waiting to hear what He has shown you."},
tl:{s:"Ang Tagapagdalang Kaalaman",d:"Naglalagak ang Diyos ng katotohanang desperadong kailangan ng iba sa iyo. Tulad ng mga alagad na humanga kung paano pinangasiwaan ni Hesus ang Salita, mayroon kang kapasidad na ibinigay ng Espiritu upang tumanggap at maiparating ang banal na kaalaman.",v:"\"Ang mga lihim na bagay ay sa Panginoon nating Dios; ngunit ang mga bagay na nahayag ay sa atin at sa ating mga anak magpakailan man.\" — Deuteronomio 29:29",tc:"Ang kaloob ng Kaalaman nang walang pagmamahal ay maaaring maging intelektwal na pagmamalaki. Ibahagi ang isang pananaw nang espesipiko upang paglingkuran ang isang tao — hindi upang impress sila.",mini:["Admin/Logistics","Fellowship","Youth & Children"],enc:"Ang inilagak ng Diyos sa iyo ay hindi para lamang sa iyo — ito ay kayamanan para sa buong simbahan, at may mga taong naghihintay na marinig ang ipinakita Niya sa iyo."}},
N:{en:{s:"The Vision Carrier",d:"Like Nehemiah who saw the rebuilt walls of Jerusalem before a single stone had been moved, God has placed leadership vision in you. People naturally look to you for direction, and when you speak, things move. This is a stewardship entrusted to you for the blessing of the whole community.",v:"\"Where there is no vision, the people perish.\" — Proverbs 29:18 (KJV)",tc:"Leaders can move so fast toward the vision that they leave people behind. This week, personally check in with someone who seems to be struggling to keep up — lead them, not just the vision.",mini:["Admin/Logistics","Fellowship","Youth & Children"],enc:"God gave you this gift not for your comfort but for His kingdom — step forward boldly, serve humbly, and watch God multiply what you carry."},
tl:{s:"Ang Nagdadala ng Bisyon",d:"Tulad ni Nehemias na nakita ang muling itinayong mga pader ng Jerusalem bago pa man gumalaw ang isang bato, naglagay ng bisyon ng pamumuno ang Diyos sa iyo. Natural na tumitingin ang mga tao sa iyo para sa direksyon, at kapag nagsalita ka, gumagalaw ang mga bagay.",v:"\"Kung walang pangitain ang bayan ay napapahamak.\" — Kawikaan 29:18",tc:"Ang mga lider ay maaaring gumalaw nang napakabilis patungo sa bisyon na nag-iiwan ng mga tao. Personal na makipag-usap sa isang taong tila nahihirapang makasabay ngayong linggo.",mini:["Admin/Logistics","Fellowship","Youth & Children"],enc:"Ibinigay ng Diyos sa iyo ang kaloob na ito ng pamumuno hindi para sa iyong kaginhawahan kundi para sa Kanyang kaharian — humakbang nang matapang, maglingkod nang mapagkumbaba."}},
O:{en:{s:"The Compassionate Servant",d:"Like the Good Samaritan who crossed every barrier to care for the one everyone else passed by, your mercy is a living revelation of the Father's heart. For OFWs who know what it feels like to be far from help, your compassion bridges the gap between God's love and human pain.",v:"\"And what does the Lord require of you? To act justly and to love mercy and to walk humbly with your God.\" — Micah 6:8",tc:"The gift of Mercy can mean absorbing others' pain without healthy boundaries. Practice caring with limits — offer your compassion fully but point people toward God as their ultimate source of healing, not yourself.",mini:["Outreach/Evangelism","Hospitality/Ushering","Youth & Children"],enc:"Every time you stop for the one that others walk past, you are doing exactly what Jesus did — and that is never, ever small."},
tl:{s:"Ang Maawain",d:"Tulad ng Mabuting Samaritano na tumawid sa bawat hadlang upang alagaan ang isang taong nilampasan ng lahat, ang iyong awa ay isang buhay na pahayag ng puso ng Ama. Para sa mga OFW na alam kung ano ang pakiramdam ng malayo sa tulong, ang iyong awa ay nagtatakip ng agwat.",v:"\"At ano ang hinihingi ng Panginoon sa iyo? Ang gumawa ng matuwid, at umiibig sa awa, at lumakad nang may kababaang-loob kasama ang iyong Diyos.\" — Mikas 6:8",tc:"Ang kaloob ng Awa ay maaaring mangahulugang pagsipsip ng sakit ng iba nang walang malusog na hangganan. Magsanay ng pag-aalaga na may hangganan — ituro ang mga tao sa Diyos bilang pinakamataas na pinagmulan ng pagpapagaling.",mini:["Outreach/Evangelism","Hospitality/Ushering","Youth & Children"],enc:"Sa tuwing humihinto ka para sa isang taong nilalampasan ng iba, ginagawa mo nang eksakto ang ginawa ni Hesus — at hindi iyon kailanman maliit."}},
P:{en:{s:"The Bold Voice",d:"Like Jeremiah who declared he could not hold God's word back even when it cost him greatly, you carry a holy fire to declare God's truth with clarity and courage. You see what is wrong and feel compelled to say so. This is not a flaw — it is a prophetic gift the church desperately needs, covered in love.",v:"\"His word is in my heart like a fire, a fire shut up in my bones. I am weary of holding it in; indeed, I cannot.\" — Jeremiah 20:9",tc:"The prophetic gift without compassion can wound rather than heal. Before speaking a truth you feel compelled to share, ask yourself: 'Is this for their restoration, or for my satisfaction?' Let love be the filter.",mini:["Outreach/Evangelism","Fellowship","Prayer Ministry"],enc:"The church needs your voice — not louder, but deeper in love. When truth and compassion flow together through you, lives are genuinely transformed."},
tl:{s:"Ang Matapang na Boses",d:"Tulad ni Jeremias na nagsabing hindi niya mapipigilan ang Salita ng Diyos kahit na malaki ang gastos sa kanya, nagdadala ka ng banal na apoy upang ipahayag ang katotohanan ng Diyos nang may linaw at lakas ng loob.",v:"\"Ang kanyang salita ay nasa aking puso na parang apoy, isang apoy na nakasarado sa aking mga buto. Pagod na akong pigilin ito; katotohanan, hindi ko kaya.\" — Jeremias 20:9",tc:"Ang propetikong kaloob nang walang awa ay maaaring manakit. Bago magsalita ng katotohanang nadarama mong kailangang ibahagi, tanungin ang iyong sarili: 'Ito ba ay para sa kanilang pagpapanumbalik, o para sa aking kasiyahan?'",mini:["Outreach/Evangelism","Fellowship","Prayer Ministry"],enc:"Kailangan ng simbahan ang iyong boses — hindi mas malakas, kundi mas malalim sa pagmamahal. Kapag ang katotohanan at awa ay dumadaloy nang magkasama sa pamamagitan mo, ang mga buhay ay tunay na nababago."}},
Q:{en:{s:"The Faithful Shepherd",d:"Like Timothy who genuinely cared for the wellbeing of the believers, you have a God-given heart to walk alongside people through every season of life. You notice when someone is missing. You remember struggles and prayers. Your love for people is consistent, long-term, and deeply pastoral.",v:"\"Be shepherds of God's flock that is under your care, watching over them — not because you must, but because you are willing.\" — 1 Peter 5:2",tc:"Shepherds can become overprotective, preventing the very growth they want for their flock. Identify one person you've been guiding and intentionally release them to make their own decision — trust that God is also their shepherd.",mini:["Youth & Children","Fellowship","Prayer Ministry"],enc:"The people God has placed in your care are not accidents — He chose you specifically to love and shepherd them, and your faithfulness to that calling changes their lives forever."},
tl:{s:"Ang Tapat na Pastor",d:"Tulad ni Timoteo na tunay na nagmalasakit sa kapakanan ng mga mananampalataya, mayroon kang puso mula sa Diyos na sumabay sa mga tao sa bawat panahon ng buhay. Napapansin mo kapag may nawawala. Naaalaala mo ang mga pakikibaka at panalangin.",v:"\"Kayo'y maging mga pastol ng kawan ng Diyos na nasa inyong pag-aalaga, na nangangasiwa sa kanila — hindi sapagka't kailangan ninyo, kundi sapagka't nais ninyo.\" — 1 Pedro 5:2",tc:"Ang mga pastol ay maaaring maging labis na mapagprotekta. Tukuyin ang isang taong iyong ginagabayan at sadyang palayain sila upang gumawa ng kanilang sariling desisyon — magtiwala na ang Diyos ay pastol din nila.",mini:["Youth & Children","Fellowship","Prayer Ministry"],enc:"Ang mga taong inilagay ng Diyos sa iyong pag-aalaga ay hindi aksidente — pinili ka Niya nang espesipiko upang mahalin at pangalagaan sila, at ang iyong katapatan ay nagbabago ng kanilang buhay magpakailanman."}},
R:{en:{s:"The Teacher",d:"Like Ezra who devoted himself to studying and teaching God's law, your gift takes the deep truths of God's Word and makes them accessible, practical, and life-changing for ordinary people. You don't just transfer information — you transfer transformation.",v:"\"Ezra had devoted himself to the study and observance of the Law of the Lord, and to teaching its decrees and laws in Israel.\" — Ezra 7:10",tc:"Teachers can prioritize accuracy over relationship — valuing being right more than being heard. Teach someone one-on-one in a conversation rather than a classroom — let your gift serve a relationship, not just a curriculum.",mini:["Youth & Children","Fellowship","Outreach/Evangelism"],enc:"Every time you open God's Word and help someone understand it in a new way, you are planting seeds that will bear fruit for eternity — keep teaching, kapatid."},
tl:{s:"Ang Guro",d:"Tulad ni Ezra na nagtukoy ng kanyang sarili sa pag-aaral at pagtuturo ng batas ng Panginoon, ang iyong kaloob ng pagtuturo ay kinukuha ang malalim na katotohanan ng Salita ng Diyos at ginagawang accessible, praktikal, at nagbabago ng buhay para sa mga ordinaryong tao.",v:"\"Si Ezra ay nagtukoy sa kanyang sarili sa pag-aaral at pagsunod sa Kautusan ng Panginoon, at sa pagtuturo ng mga utos at kautusan nito sa Israel.\" — Ezra 7:10",tc:"Ang mga guro ay maaaring bigyang-priyoridad ang katumpakan kaysa sa relasyon. Magturo sa isang tao nang isa-sa-isa sa isang pag-uusap sa halip na sa isang silid-aralan.",mini:["Youth & Children","Fellowship","Outreach/Evangelism"],enc:"Sa tuwing binubuksan mo ang Salita ng Diyos at tinutulungan ang isang tao na maunawaan ito sa bagong paraan, nagtatatanim ka ng mga binhi na magbubunga sa walang hanggan — magpatuloy sa pagtuturo, kapatid."}},
S:{en:{s:"The Wise Counselor",d:"Like Solomon who received divine wisdom to govern with discernment, or Daniel who gave counsel to kings — you have the rare gift of seeing through life's complexity and applying God's eternal truth to the most tangled situations. People come to you with unsolvable problems, and somehow you help them find the way forward.",v:"\"If any of you lacks wisdom, you should ask God, who gives generously to all without finding fault, and it will be given to you.\" — James 1:5",tc:"Those with Wisdom can withhold insight until they have the perfect answer. Proactively offer your counsel to someone you sense is struggling — don't wait to be asked. Your wisdom is needed now.",mini:["Admin/Logistics","Fellowship","Prayer Ministry"],enc:"You carry something rare and precious — keep offering it generously, because there are people in this congregation walking in confusion that your one word from God can set free."},
tl:{s:"Ang Marunong na Tagapayo",d:"Tulad ni Solomon na nakatanggap ng banal na karunungan para mamuno nang may pagkilatis, o ni Daniel na nagbigay ng payo sa mga hari — mayroon kang bihirang kaloob na makita sa pamamagitan ng pagiging kumplikado ng buhay at ilapat ang walang hanggang katotohanan ng Diyos sa pinaka-mahirap na mga sitwasyon.",v:"\"Kung ang sinuman sa inyo ay nagkukulang ng karunungan, siya'y humingi sa Diyos, na nagbibigay ng bukas-palad sa lahat nang walang pagtutuligsa, at ibibigay ito sa kanya.\" — Santiago 1:5",tc:"Ang mga may kaloob ng Karunungan ay maaaring pigilin ang kanilang pananaw hanggang sa mayroon silang perpektong sagot. Aktibong alok ang iyong payo sa isang taong nadarama mong nahihirapan — huwag maghintay.",mini:["Admin/Logistics","Fellowship","Prayer Ministry"],enc:"Dala mo ang isang bagay na bihira at mahalagang — magpatuloy sa pagiging bukas-palad sa pagbibigay nito, sapagkat may mga taong sa kongregasyong ito na maaaring mapalaya ng isang salita mo mula sa Diyos."}}
};

function calcScores(ans){const s={};GK.forEach(k=>s[k]=0);QS.forEach((_,i)=>s[GK[i%19]]+=(ans[i]||0));return s;}
function getTop3(s){return Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>({k,v,name:GN[k],emoji:GE[k]}));}
function getBottom3(s){return Object.entries(s).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([k,v])=>({k,v,name:GN[k],emoji:GE[k]}));}

function App(){
  const[lang,setLang]=useState("en");
  const[phase,setPhase]=useState(0);
  const[pg,setPg]=useState(0);
  const[ans,setAns]=useState({});
  const[res,setRes]=useState(null);
  const[warn,setWarn]=useState(false);
  const[copied,setCopied]=useState(false);
  const topRef=useRef(null);
  const t=TX[lang];
  const stn=phase<=1?0:1;
  const pgS=pg*19;
  const activeQS=lang==="tl"?QS_TL:QS;
  const pgQs=activeQS.slice(pgS,pgS+19);
  const pgDone=pgQs.every((_,i)=>ans[pgS+i]!==undefined);
  const totalAns=Object.keys(ans).length;
  const scroll=()=>{if(topRef.current)topRef.current.scrollIntoView({behavior:"auto"})};
  const C=(x={})=>({background:"white",border:`1px solid ${BD}`,borderRadius:12,...x});

  const nextPg=()=>{
    if(!pgDone){setWarn(true);scroll();return;}
    setWarn(false);scroll();
    if(pg<6)setPg(p=>p+1);
    else buildResult();
  };
  const backPg=()=>{setWarn(false);scroll();if(pg>0)setPg(p=>p-1);else setPhase(0);};

  const buildResult=()=>{
    const scores=calcScores(ans);
    const t3=getTop3(scores);
    const b3=getBottom3(scores);
    const pk=t3[0].k;
    const prf=PRF[pk][lang];
    setRes({scores,t3,b3,prf,pk});
    setPhase(2);
  };

  const reset=()=>{setPhase(0);setPg(0);setAns({});setRes(null);setWarn(false);setCopied(false);scroll();};

  const buildShareText=(r)=>{
    const{prf,t3,b3,pk}=r;
    return `🫙 FLCC Kuwait | Spiritual Gifts Discovery\n\n`+
      `${GE[pk]} PRIMARY GIFT: ${GN[pk]}\n`+
      `Serving Style: ${prf.s}\n\n`+
      `✅ TOP 3 GIFTS (Strongest):\n${t3.map((g,i)=>`${i+1}. ${g.emoji} ${g.name} — ${g.v}/21`).join("\n")}\n\n`+
      `🔄 LOWEST 3 GIFTS (Lean on the Team):\n${b3.map((g,i)=>`${i+1}. ${g.emoji} ${g.name} — ${g.v}/21`).join("\n")}\n\n`+
      `${prf.v}\n\n`+
      `🧺 TOWEL CHALLENGE:\n${prf.tc}\n\n`+
      `📌 SUGGESTED MINISTRIES: ${prf.mini.join(" · ")}\n\n`+
      `"${prf.enc}"\n\n`+
      `🚀 Next Step: Speak to your Ministry Head or Church Pastor\n\n`+
      `🔗 Take the assessment: ${SITE_URL}`;
  };

  const handleEmail=(r)=>{
    const sub=encodeURIComponent(`My Spiritual Gifts Profile — FLCC Kuwait`);
    const body=encodeURIComponent(buildShareText(r));
    window.open(`mailto:?subject=${sub}&body=${body}`,"_blank");
  };

  const handleCopy=(r)=>{
    const txt=buildShareText(r);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});
    }else{
      const ta=document.createElement("textarea");
      ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand("copy");setCopied(true);setTimeout(()=>setCopied(false),2500);}catch(e){}
      document.body.removeChild(ta);
    }
  };

  return(
    <div ref={topRef} style={{maxWidth:560,margin:"0 auto"}}>
      {/* HEADER */}
      <div style={{background:A,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,.18)"}}>
        <div>
          <div style={{fontSize:9,color:"rgba(255,255,255,.55)",letterSpacing:".12em",textTransform:"uppercase",fontWeight:700}}>{t.ch}</div>
          <div style={{fontSize:13,color:"white",fontWeight:700,marginTop:1}}>Spiritual Gifts & Servant Leadership</div>
        </div>
        <button onClick={()=>setLang(l=>l==="en"?"tl":"en")} className="no-print" style={{background:"rgba(255,255,255,.18)",border:"1px solid rgba(255,255,255,.3)",color:"white",borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,flexShrink:0}}>🌐 {t.lb}</button>
      </div>

      {/* STEPPER */}
      {phase>0&&phase<3&&(
        <div style={{background:"white",padding:"10px 16px",borderBottom:`1px solid ${BD}`,display:"flex",alignItems:"center"}}>
          {t.st.map((s,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",flex:i<1?1:"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                <div style={{width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,background:i<stn?TL:i===stn?A:"#E5E7EB",color:i<=stn?"white":GR}}>{i<stn?"✓":i+1}</div>
                <span style={{fontSize:10,fontWeight:600,color:i===stn?A:i<stn?TL:GR,whiteSpace:"nowrap"}}>{s}</span>
              </div>
              {i<1&&<div style={{flex:1,height:2,margin:"0 5px",background:i<stn?TL:"#E5E7EB",borderRadius:1}}/>}
            </div>
          ))}
        </div>
      )}

      <div style={{padding:"16px 16px 0"}}>

        {/* ═══ INTRO ═══ */}
        {phase===0&&(
          <div className="fade">
            <div style={{textAlign:"center",marginBottom:14}}>
              <div style={{fontSize:56,marginBottom:10}}>🫙</div>
              <h1 style={{fontSize:20,fontWeight:800,color:"#1F2937",lineHeight:1.3,whiteSpace:"pre-line",marginBottom:12}}>{t.it}</h1>
              <div style={{background:AG,border:`1px solid ${AL}`,borderLeft:`4px solid ${A}`,borderRadius:8,padding:"10px 14px",textAlign:"left",marginBottom:12}}>
                <p style={{fontSize:13,color:A,fontStyle:"italic",lineHeight:1.65,margin:0}}>{t.iv}</p>
              </div>
              <p style={{fontSize:14,color:"#374151",lineHeight:1.7,textAlign:"left",marginBottom:12}}>{t.id}</p>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:10}}>
                {t.ph.map((p,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:5,background:GRG,border:`1px solid ${BD}`,borderRadius:20,padding:"5px 12px",fontSize:11,color:GR}}>
                    <span style={{width:16,height:16,borderRadius:"50%",background:A,color:"white",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700}}>{i+1}</span>{p}
                  </div>
                ))}
              </div>
              <div style={{fontSize:12,color:GR,marginBottom:12}}>{t.im}</div>
            </div>
            <div style={{background:GRG,border:`1px solid ${BD}`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:GR,lineHeight:1.6}}>{t.prv}</div>
            <button onClick={()=>{setPhase(1);setPg(0);scroll();}} style={{width:"100%",padding:"15px",background:A,color:"white",border:"none",borderRadius:12,fontSize:16,fontWeight:700,marginBottom:20}}>{t.is}</button>
          </div>
        )}

        {/* ═══ ASSESSMENT ═══ */}
        {phase===1&&(
          <div className="fade">
            <div style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}}>
                <h2 style={{fontSize:14,fontWeight:700,color:"#1F2937",margin:0,flex:1}}>{t.pt}</h2>
                <span style={{fontSize:10,color:A,fontWeight:700,background:AL,borderRadius:8,padding:"2px 8px",flexShrink:0,marginLeft:8}}>{t.po(pg+1)}</span>
              </div>
              <p style={{fontSize:12,color:GR,fontStyle:"italic",marginBottom:8}}>{t.pn}</p>
              <div style={{display:"flex",gap:3,marginBottom:3}}>{[0,1,2,3,4,5,6].map(i=><div key={i} style={{flex:1,height:6,borderRadius:3,background:i<pg?TL:i===pg?A:"#E5E7EB"}}/>)}</div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:GR}}>
                <span>{lang==="en"?"Page":"Pahina"} {pg+1}/7</span>
                <span>{totalAns}/133 {lang==="en"?"answered":"nasagot"}</span>
              </div>
            </div>
            {/* Scale legend */}
            <div style={{display:"flex",gap:1,marginBottom:12,borderRadius:8,overflow:"hidden",border:`1px solid ${BD}`}}>
              {[0,1,2,3].map(v=>(
                <div key={v} style={{flex:1,textAlign:"center",padding:"6px 2px",background:["#F9FAFB","#FEF3C7","#FEF08A","#FFFBEB"][v]}}>
                  <div style={{fontSize:15,fontWeight:800,color:A}}>{v}</div>
                  <div style={{fontSize:8,color:GR,lineHeight:1.3,whiteSpace:"pre-line"}}>{t.sh[v]}</div>
                </div>
              ))}
            </div>
            {warn&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:12,color:"#DC2626",fontWeight:600}}>{t.pw}</div>}
            {pgQs.map((_,qi)=>{
              const idx=pgS+qi,sel=ans[idx];
              return(
                <div key={idx} style={{...C(),padding:"11px 12px",marginBottom:7,borderColor:sel!==undefined?"rgba(180,83,9,.2)":BD}}>
                  <div style={{display:"flex",gap:7,alignItems:"flex-start",marginBottom:8}}>
                    <span style={{fontSize:9,fontWeight:700,color:"white",background:sel!==undefined?A:GR,borderRadius:5,padding:"2px 5px",flexShrink:0,marginTop:2,lineHeight:1.3}}>Q{idx+1}</span>
                    <p style={{fontSize:14,lineHeight:1.65,margin:0,color:"#1F2937",flex:1}}>{activeQS[idx]}</p>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    {[0,1,2,3].map(v=>(
                      <button key={v} onClick={()=>{setAns(p=>({...p,[idx]:v}));setWarn(false);}}
                        style={{flex:1,padding:"9px 4px",fontSize:16,fontWeight:800,background:sel===v?A:"white",border:`2px solid ${sel===v?A:BD}`,borderRadius:8,color:sel===v?"white":A,transition:"all .1s"}}>{v}</button>
                    ))}
                  </div>
                </div>
              );
            })}
            <div style={{display:"flex",gap:10,padding:"12px 0 20px"}} className="no-print">
              <button onClick={backPg} style={{padding:"13px 14px",background:"white",border:`1px solid ${BD}`,borderRadius:10,fontSize:14,color:GR,fontWeight:500}}>{t.bk}</button>
              <button onClick={nextPg} style={{flex:1,padding:"13px",fontSize:15,fontWeight:700,background:A,color:"white",border:"none",borderRadius:10}}>
                {pg<6?t.nx:(lang==="en"?"See My Profile →":"Tingnan ang Aking Profile →")}
              </button>
            </div>
          </div>
        )}

        {/* ═══ RESULT ═══ */}
        {phase===2&&res&&(()=>{
          const{scores,t3,b3,prf,pk}=res;
          return(
            <div className="fade">
              {/* PRINT HEADER — visible only when printing */}
              <div className="print-header" style={{display:"none"}}>
                <div style={{fontSize:10,letterSpacing:".1em",textTransform:"uppercase",opacity:.7,marginBottom:2}}>FLCC Kuwait</div>
                <div style={{fontSize:16,fontWeight:700}}>Spiritual Gifts & Servant Leadership Profile</div>
              </div>

              {/* Hero */}
              <div className="print-card print-amber" style={{background:AG,border:`1px solid ${AL}`,borderRadius:16,padding:"22px 16px",textAlign:"center",marginBottom:12}}>
                <div style={{fontSize:50,marginBottom:8}}>{GE[pk]}</div>
                <div style={{fontSize:9,color:GR,fontWeight:700,letterSpacing:".12em",textTransform:"uppercase",marginBottom:4}}>{t.sl}</div>
                <h2 style={{fontSize:24,fontWeight:800,color:A,margin:"0 0 10px",lineHeight:1.2}}>{prf.s}</h2>
                <p style={{fontSize:14,color:"#374151",lineHeight:1.7,margin:0}}>{prf.d}</p>
              </div>

              {/* Top 3 */}
              <div className="print-card" style={{marginBottom:12}}>
                <div style={{fontSize:10,color:GR,fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:4}}>{t.t3}</div>
                <div style={{fontSize:11,color:A,fontStyle:"italic",marginBottom:8}}>{lang==="en"?"These are the gifts God has most strongly placed in you.":"Ito ang mga kaloob na pinaka-malakas na inilagay ng Diyos sa iyo."}</div>
                <div style={{display:"flex",gap:8}}>
                  {t3.map((g,i)=>(
                    <div key={i} style={{flex:1,background:"white",border:`2px solid ${i===0?A:BD}`,borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
                      <div style={{fontSize:24,marginBottom:4}}>{g.emoji}</div>
                      <div style={{fontSize:9,fontWeight:700,color:i===0?A:GR,lineHeight:1.3}}>{g.name}</div>
                      <div style={{background:i===0?A:GRG,color:i===0?"white":GR,borderRadius:10,padding:"2px 6px",fontSize:11,fontWeight:700,marginTop:4,display:"inline-block"}}>{g.v}/21</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Bottom 3 */}
              <div className="print-card" style={{background:"white",border:`1px solid ${BD}`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                <div style={{fontSize:10,color:"#6B7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:4}}>{t.b3}</div>
                <div style={{fontSize:11,color:GR,fontStyle:"italic",lineHeight:1.55,marginBottom:10}}>{t.b3note}</div>
                <div style={{display:"flex",gap:8}}>
                  {b3.map((g,i)=>(
                    <div key={i} style={{flex:1,background:GRG,border:`1.5px dashed #D1D5DB`,borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
                      <div style={{fontSize:22,marginBottom:4,opacity:.65}}>{g.emoji}</div>
                      <div style={{fontSize:9,fontWeight:600,color:GR,lineHeight:1.3}}>{g.name}</div>
                      <div style={{background:"#E5E7EB",color:GR,borderRadius:10,padding:"2px 6px",fontSize:11,fontWeight:600,marginTop:4,display:"inline-block"}}>{g.v}/21</div>
                    </div>
                  ))}
                </div>
                <div style={{marginTop:10,padding:"8px 10px",background:"#F3F4F6",borderRadius:8,fontSize:12,color:GR,lineHeight:1.6}}>
                  💡 {lang==="en"
                    ?"This means you will thrive most when you serve alongside people who are strong in these areas. A healthy church is built when every gift works together."
                    :"Nangangahulugan ito na mas magiging matagumpay ka kapag naglilingkod kasama ang mga taong malakas sa mga larangang ito. Ang isang malusog na simbahan ay itinayo kapag ang bawat kaloob ay magkasamang gumagana."}
                </div>
              </div>

              {/* Score Chart */}
              <div className="print-card" style={{...C(),padding:"12px 14px",marginBottom:12}}>
                <div style={{fontSize:10,color:GR,fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>{t.sc}</div>
                {GK.map(k=>{
                  const sc=scores[k]||0,isTop=t3.some(g=>g.k===k);
                  return(
                    <div key={k} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                      <div style={{width:60,display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
                        <span style={{fontSize:8,fontWeight:700,color:isTop?A:GR,width:10}}>{k}</span>
                        <span style={{fontSize:9,color:isTop?A:GR,lineHeight:1.2}}>{GN[k]}</span>
                      </div>
                      <div style={{flex:1,height:9,background:"#F3F4F6",borderRadius:4,overflow:"hidden"}}>
                        <div style={{height:"100%",borderRadius:4,background:isTop?A:"#D1D5DB",width:`${(sc/21)*100}%`}}/>
                      </div>
                      <span style={{fontSize:9,color:isTop?A:GR,fontWeight:isTop?700:400,width:28,textAlign:"right",flexShrink:0}}>{sc}/21</span>
                    </div>
                  );
                })}
              </div>

              {/* Verse */}
              <div className="print-card print-amber" style={{background:"white",border:`1px solid ${BD}`,borderLeft:`4px solid ${A}`,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                <div style={{fontSize:9,color:GR,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>{t.vl}</div>
                <p style={{fontSize:14,fontStyle:"italic",color:A,margin:0,lineHeight:1.7}}>{prf.v}</p>
              </div>

              {/* Towel Challenge */}
              <div className="print-card print-teal" style={{background:TLG,border:`1px solid rgba(15,118,110,.15)`,borderLeft:`4px solid ${TL}`,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                <div style={{fontSize:9,color:TL,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>🧺 {t.tc}</div>
                <p style={{fontSize:14,color:"#134E4A",margin:0,lineHeight:1.7}}>{prf.tc}</p>
              </div>

              {/* Ministries */}
              <div className="print-card" style={{marginBottom:10}}>
                <div style={{fontSize:10,color:GR,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>{t.ml}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {prf.mini.map((m,i)=><span key={i} style={{background:"white",border:`2px solid ${A}`,borderRadius:20,padding:"7px 16px",fontSize:13,color:A,fontWeight:700}}>{m}</span>)}
                </div>
              </div>

              {/* Encouragement */}
              <div className="print-card" style={{...C(),padding:"14px",marginBottom:12}}>
                <div style={{fontSize:9,color:GR,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>{t.el}</div>
                <p style={{fontSize:16,color:"#1F2937",margin:0,lineHeight:1.65,fontWeight:600,fontStyle:"italic"}}>"{prf.enc}"</p>
              </div>

              {/* Next Step */}
              <div className="print-card print-next" style={{background:A,borderRadius:14,padding:"18px 16px",marginBottom:14}}>
                <div style={{fontSize:9,color:"rgba(255,255,255,.55)",fontWeight:700,letterSpacing:".12em",textTransform:"uppercase",marginBottom:5}}>🚀 {t.ns}</div>
                <p style={{fontSize:14,color:"white",lineHeight:1.65,margin:"0 0 10px"}}>{t.nt}</p>
                <div style={{fontSize:15,color:"white",fontWeight:700,borderTop:"1px solid rgba(255,255,255,.25)",paddingTop:10}}>{t.ld}</div>
              </div>

              {/* ACTION BUTTONS */}
              <div className="no-print" style={{display:"flex",flexDirection:"column",gap:8,paddingBottom:24}}>
                {/* Print */}
                <button onClick={()=>window.print()}
                  style={{width:"100%",padding:"14px",background:A,color:"white",border:"none",borderRadius:10,fontSize:15,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  {t.pr}
                </button>
                {/* Email */}
                <button onClick={()=>handleEmail(res)}
                  style={{width:"100%",padding:"14px",background:"white",border:`2px solid ${A}`,borderRadius:10,fontSize:15,fontWeight:700,color:A,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  {t.em}
                </button>
                {/* Copy for Messenger */}
                <button onClick={()=>handleCopy(res)}
                  style={{width:"100%",padding:"14px",background:copied?"#065F46":"white",border:`2px solid ${copied?"#065F46":TL}`,borderRadius:10,fontSize:15,fontWeight:700,color:copied?"white":TL,transition:"all .2s",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  {copied?t.copied:t.ms}
                </button>
                {copied&&(
                  <div style={{background:TLG,border:`1px solid rgba(15,118,110,.2)`,borderRadius:8,padding:"10px 14px",fontSize:12,color:"#065F46",lineHeight:1.6,textAlign:"center"}}>
                    {lang==="en"?"Profile copied! Now open Messenger → paste in your message → send 🙏":"Nakopya na ang profile! Ngayon buksan ang Messenger → i-paste sa iyong mensahe → ipadala 🙏"}
                  </div>
                )}
                {/* Take Again */}
                <button onClick={reset}
                  style={{width:"100%",padding:"12px",background:"white",border:`1px solid ${BD}`,borderRadius:10,fontSize:14,color:GR}}>
                  {t.rr}
                </button>
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
